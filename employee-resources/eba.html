<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enterprise Bargaining Agreement - Bromar</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --brand-primary: #1a56db;
      --brand-secondary: #0e9f6e;
      --brand-accent: #ff6b35;
      --brand-orange: #c2440e;
      --brand-orange-soft: #fff3ee;
      --brand-dark: #111827;
      --brand-mid: #374151;
      --brand-light: #f3f6ff;
      --brand-white: #ffffff;
      --bg-gradient: linear-gradient(135deg, #e8eeff 0%, #f0faf5 50%, #fff4ef 100%);
      --card-shadow: 0 20px 60px rgba(26, 86, 219, 0.12), 0 4px 16px rgba(0,0,0,0.06);
      --radius: 14px;
      --radius-sm: 8px;
      --input-bg: #fafbff;
      --input-bg-focus: #ffffff;
      --input-border: #d1d9f0;
      --input-focus: #1a56db;
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #6b7280;
      --text-faded: #9ca3af;
      --divider: #e5e7eb;
      --footer-bg: #fafafa;
      --error: #ef4444;
      --success: #0e9f6e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --brand-orange: #f0723f;
        --brand-orange-soft: rgba(240, 114, 63, 0.12);
        --brand-dark: #f4f4f5;
        --brand-mid: #a1a1aa;
        --brand-light: rgba(240, 114, 63, 0.08);
        --brand-white: #1a1d21;
        --bg-gradient: linear-gradient(135deg, #0f1113 0%, #15171a 50%, #1a1418 100%);
        --card-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
        --input-bg: #13161a;
        --input-bg-focus: #1a1d21;
        --input-border: #2a2d32;
        --input-focus: #f0723f;
        --text-primary: #f4f4f5;
        --text-secondary: #d4d4d8;
        --text-muted: #a1a1aa;
        --text-faded: #71717a;
        --divider: #2a2d32;
        --footer-bg: #13161a;
      }
    }

    /* Force light mode when class is added */
    html.light-mode {
      --brand-orange: #c2440e;
      --brand-orange-soft: #fff3ee;
      --brand-dark: #111827;
      --brand-mid: #374151;
      --brand-light: #f3f6ff;
      --brand-white: #ffffff;
      --bg-gradient: linear-gradient(135deg, #e8eeff 0%, #f0faf5 50%, #fff4ef 100%);
      --card-shadow: 0 20px 60px rgba(26, 86, 219, 0.12), 0 4px 16px rgba(0,0,0,0.06);
      --input-bg: #fafbff;
      --input-bg-focus: #ffffff;
      --input-border: #d1d9f0;
      --input-focus: #1a56db;
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #6b7280;
      --text-faded: #9ca3af;
      --divider: #e5e7eb;
      --footer-bg: #fafafa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      padding: 40px 16px 60px;
      color: var(--brand-dark);
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #bfcfff, #e0e8ff);
      top: -100px; left: -100px;
      animation: blob1 12s ease-in-out infinite;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #b2f0d8, #d4f7eb);
      bottom: -80px; right: -80px;
      animation: blob2 15s ease-in-out infinite;
    }
    @keyframes blob1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,30px) scale(1.08)} }
    @keyframes blob2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-30px,-40px) scale(1.06)} }
    @media (prefers-color-scheme: dark) {
      body::before { background: radial-gradient(circle, #2a3a5e, #1a2540); opacity: 0.4; }
      body::after  { background: radial-gradient(circle, #3d2415, #2a1a0e); opacity: 0.35; }
    }

    .page-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Home icon button — top left of header */
    .home-icon {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--brand-white);
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.2s;
      z-index: 2;
    }
    .home-icon:hover {
      color: var(--brand-orange);
      border-color: var(--brand-orange);
      background: var(--brand-orange-soft);
      transform: translateY(-1px);
    }
    .home-icon svg { width: 18px; height: 18px; }

    /* Theme toggle button — top left next to home */
    .theme-toggle {
      position: absolute;
      top: 18px;
      left: 64px;
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--brand-white);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      z-index: 2;
    }
    .theme-toggle:hover {
      color: var(--brand-orange);
      border-color: var(--brand-orange);
      background: var(--brand-orange-soft);
      transform: translateY(-1px);
    }
    .theme-toggle svg { width: 18px; height: 18px; }
    
    /* Show/hide icons based on theme */
    .sun-icon { display: none; }
    .moon-icon { display: block; }
    
    html.light-mode .sun-icon { display: block; }
    html.light-mode .moon-icon { display: none; }

    /* Header card with logo */
    .header-card {
      background: var(--brand-white);
      color: var(--text-primary);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 36px 40px 28px;
      text-align: center;
      border-bottom: 3px solid var(--brand-light);
      position: relative;
      overflow: hidden;
    }
    .header-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary), var(--brand-accent));
    }

    .logo-container {
      margin-bottom: 20px;
    }
    .logo-container img {
      max-height: 80px;
      max-width: 260px;
      object-fit: contain;
    }

    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 2.5px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .header-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Main content card */
    .content-card {
      background: var(--brand-white);
      border-radius: 0 0 var(--radius) var(--radius);
      color: var(--text-primary);
      padding: 36px 40px 40px;
      box-shadow: var(--card-shadow);
    }

    /* Controls bar */
    .controls-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--divider);
    }

    /* Search controls */
    .search-controls {
      display: flex;
      gap: 12px;
      flex: 1;
      min-width: 300px;
      flex-wrap: wrap;
    }

    .search-input-wrapper {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 11px 44px 11px 14px;
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.93rem;
      color: var(--text-primary);
      background: var(--input-bg);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
      background: var(--input-bg-focus);
    }

    .search-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--brand-orange);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .search-btn:hover {
      background: #a3380b;
      transform: translateY(-50%) translateY(-1px);
    }

    .search-nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-btn {
      width: 42px;
      height: 42px;
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-sm);
      background: var(--input-bg);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--brand-primary);
      background: var(--brand-white);
      color: var(--brand-primary);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .search-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      padding: 0 8px;
    }

    .clear-btn {
      padding: 11px 18px;
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--input-bg);
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    /* Page controls */
    .page-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .page-nav {
      display: flex;
      gap: 6px;
    }

    .page-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-width: 100px;
      text-align: center;
    }

    .zoom-controls {
      display: flex;
      gap: 6px;
    }

    .download-btn {
      padding: 11px 18px;
      border: 1.5px solid var(--brand-orange);
      border-radius: var(--radius-sm);
      background: var(--brand-orange);
      color: white;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .download-btn:hover {
      background: #a3380b;
      border-color: #a3380b;
    }

    /* PDF container */
    .pdf-container {
      width: 100%;
      height: calc(100vh - 450px);
      min-height: 600px;
      border: 2px solid var(--input-border);
      border-radius: var(--radius-sm);
      overflow: auto;
      background: #525659;
      position: relative;
    }

    #pdfCanvas {
      display: block;
      margin: 20px auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--brand-white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--input-border);
      border-top-color: var(--brand-orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Error message */
    .error-message {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .error-message.show {
      display: block;
    }

    @media (prefers-color-scheme: dark) {
      .error-message {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }
      .loading-overlay {
        background: var(--brand-white);
      }
    }

    html.light-mode .error-message {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    @media (max-width: 720px) {
      .header-card, .content-card { 
        padding-left: 22px; 
        padding-right: 22px; 
      }
      
      .controls-bar {
        flex-direction: column;
        align-items: stretch;
      }
      
      .search-controls,
      .page-controls {
        width: 100%;
      }
      
      .search-input-wrapper {
        width: 100%;
      }
      
      .page-controls {
        justify-content: space-between;
      }
      
      .pdf-container {
        height: calc(100vh - 600px);
        min-height: 400px;
      }
    }

    /* Text layer for search highlighting */
    .textLayer {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 0.2;
      line-height: 1.0;
    }

    .textLayer > span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    .textLayer .highlight {
      background-color: rgba(255, 255, 0, 0.4);
      border-radius: 2px;
    }

    .textLayer .highlight.selected {
      background-color: rgba(255, 153, 0, 0.6);
    }
  </style>
</head>
<body>
<div class="page-wrapper">

  <!-- HEADER -->
  <div class="header-card">
    <a href="../index.html" class="home-icon" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/>
      </svg>
    </a>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
      <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <div class="logo-container">
      <picture>
        <source srcset="../Bromar-Primary-Logo-Reverse-White.png" media="(prefers-color-scheme: dark)" />
        <img src="../Bromar-Primary-Logo-Full-Colour.png" alt="Bromar Logo" />
      </picture>
    </div>
    <h1 class="header-title">Enterprise Bargaining Agreement</h1>
    <p class="header-subtitle">Search and browse through the Enterprise Bargaining Agreement 2025-2029</p>
  </div>

  <!-- CONTENT CARD -->
  <div class="content-card">
    
    <div class="error-message" id="errorMessage">
      Could not load PDF. Please make sure the file "eba2025-2029.pdf" exists in the same folder.
    </div>

    <!-- CONTROLS BAR -->
    <div class="controls-bar">
      <!-- SEARCH CONTROLS -->
      <div class="search-controls">
        <div class="search-input-wrapper">
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search in document..."
            autocomplete="off"
          />
          <button id="searchBtn" class="search-btn">Search</button>
        </div>
        
        <div class="search-nav">
          <button id="prevMatch" class="nav-btn" title="Previous match" disabled>↑</button>
          <span class="search-info" id="searchInfo">-</span>
          <button id="nextMatch" class="nav-btn" title="Next match" disabled>↓</button>
        </div>
        
        <button id="clearSearch" class="clear-btn">Clear</button>
      </div>

      <!-- PAGE CONTROLS -->
      <div class="page-controls">
        <div class="page-nav">
          <button id="prevPage" class="nav-btn" title="Previous page">←</button>
          <button id="nextPage" class="nav-btn" title="Next page">→</button>
        </div>
        <span class="page-info" id="pageInfo">Page -/-</span>
        <div class="zoom-controls">
          <button id="zoomOut" class="nav-btn" title="Zoom out">-</button>
          <button id="zoomIn" class="nav-btn" title="Zoom in">+</button>
        </div>
        <button id="downloadPdf" class="download-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          Download
        </button>
      </div>
    </div>

    <!-- PDF VIEWER -->
    <div class="pdf-container" id="pdfContainer">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading PDF...</div>
      </div>
      <canvas id="pdfCanvas"></canvas>
    </div>

  </div>
</div>

<script>
  // ============================================================
  // CONFIGURATION
  // ============================================================
  const PDF_FILENAME = 'EBA.2025-2029.Bromar Electrical Services (Aust) (Updated 9Oct).pdf';
  
  // Set PDF.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ============================================================
  // THEME TOGGLE
  // ============================================================
  const themeToggle = document.getElementById('themeToggle');
  const html = document.documentElement;
  const logoImg = document.querySelector('.logo-container img');

  function updateLogo() {
    if (html.classList.contains('light-mode')) {
      logoImg.src = '../Bromar-Primary-Logo-Full-Colour.png';
    } else {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        logoImg.src = '../Bromar-Primary-Logo-Reverse-White.png';
      } else {
        logoImg.src = '../Bromar-Primary-Logo-Full-Colour.png';
      }
    }
  }

  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') {
    html.classList.add('light-mode');
  }
  updateLogo();

  themeToggle.addEventListener('click', () => {
    html.classList.toggle('light-mode');
    updateLogo();
    
    if (html.classList.contains('light-mode')) {
      localStorage.setItem('theme', 'light');
    } else {
      localStorage.removeItem('theme');
    }
  });

  // ============================================================
  // PDF VIEWER & CONTROLS
  // ============================================================
  const canvas = document.getElementById('pdfCanvas');
  const ctx = canvas.getContext('2d');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const errorMessage = document.getElementById('errorMessage');
  const pageInfo = document.getElementById('pageInfo');
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const prevMatch = document.getElementById('prevMatch');
  const nextMatch = document.getElementById('nextMatch');
  const clearSearch = document.getElementById('clearSearch');
  const searchInfo = document.getElementById('searchInfo');
  const prevPage = document.getElementById('prevPage');
  const nextPage = document.getElementById('nextPage');
  const zoomIn = document.getElementById('zoomIn');
  const zoomOut = document.getElementById('zoomOut');
  const downloadPdf = document.getElementById('downloadPdf');

  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let scale = 1.5;
  let searchMatches = [];
  let currentMatchIndex = -1;
  let isRendering = false;

  // Load PDF
  async function loadPDF() {
    try {
      loadingOverlay.classList.remove('hidden');
      errorMessage.classList.remove('show');
      
      console.log('Attempting to load PDF:', PDF_FILENAME);
      
      // First check if file exists
      const response = await fetch(PDF_FILENAME);
      console.log('Fetch response status:', response.status);
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}. File "${PDF_FILENAME}" not found.`);
      }
      
      const contentType = response.headers.get('content-type');
      console.log('Content-Type:', contentType);
      
      if (!contentType || !contentType.includes('pdf')) {
        console.warn('Warning: Content-Type is not PDF:', contentType);
      }
      
      const arrayBuffer = await response.arrayBuffer();
      console.log('PDF file size:', arrayBuffer.byteLength, 'bytes');
      
      if (arrayBuffer.byteLength === 0) {
        throw new Error('PDF file is empty (0 bytes)');
      }
      
      const loadingTask = pdfjsLib.getDocument({
        data: arrayBuffer,
        cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
        cMapPacked: true,
      });
      
      pdfDoc = await loadingTask.promise;
      totalPages = pdfDoc.numPages;
      
      console.log('PDF loaded successfully. Total pages:', totalPages);
      
      pageInfo.textContent = `Page ${currentPage}/${totalPages}`;
      
      await renderPage(currentPage);
      
      loadingOverlay.classList.add('hidden');
      
    } catch (error) {
      console.error('Error loading PDF:', error);
      console.error('Error details:', error.message);
      loadingOverlay.classList.add('hidden');
      errorMessage.innerHTML = `
        <strong>Could not load PDF.</strong><br>
        Error: ${error.message}<br><br>
        Possible causes:<br>
        • File "eba2025-2029.pdf" does not exist in this folder<br>
        • PDF file is corrupted or invalid<br>
        • File path is incorrect<br>
        • Browser security settings blocking file access<br><br>
        <em>Check the browser console (F12) for more details.</em>
      `;
      errorMessage.classList.add('show');
    }
  }

  // Render page
  async function renderPage(pageNum) {
    if (isRendering) return;
    isRendering = true;
    
    try {
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: scale });
      
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      
      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      
      await page.render(renderContext).promise;
      
      currentPage = pageNum;
      pageInfo.textContent = `Page ${currentPage}/${totalPages}`;
      
      // Update page navigation buttons
      prevPage.disabled = currentPage <= 1;
      nextPage.disabled = currentPage >= totalPages;
      
    } catch (error) {
      console.error('Error rendering page:', error);
    } finally {
      isRendering = false;
    }
  }

  // Page navigation
  prevPage.addEventListener('click', () => {
    if (currentPage > 1) {
      renderPage(currentPage - 1);
    }
  });

  nextPage.addEventListener('click', () => {
    if (currentPage < totalPages) {
      renderPage(currentPage + 1);
    }
  });

  // Zoom controls
  zoomIn.addEventListener('click', () => {
    scale += 0.25;
    renderPage(currentPage);
  });

  zoomOut.addEventListener('click', () => {
    if (scale > 0.5) {
      scale -= 0.25;
      renderPage(currentPage);
    }
  });

  // Search functionality
  async function performSearch() {
    const searchTerm = searchInput.value.trim().toLowerCase();
    
    if (!searchTerm) {
      clearSearchResults();
      return;
    }

    searchMatches = [];
    currentMatchIndex = -1;
    
    // Search through all pages
    for (let i = 1; i <= totalPages; i++) {
      const page = await pdfDoc.getPage(i);
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(item => item.str).join(' ').toLowerCase();
      
      if (pageText.includes(searchTerm)) {
        searchMatches.push(i);
      }
    }
    
    if (searchMatches.length > 0) {
      currentMatchIndex = 0;
      searchInfo.textContent = `${currentMatchIndex + 1} of ${searchMatches.length}`;
      prevMatch.disabled = false;
      nextMatch.disabled = false;
      
      // Go to first match
      await renderPage(searchMatches[0]);
    } else {
      searchInfo.textContent = 'No matches';
      prevMatch.disabled = true;
      nextMatch.disabled = true;
    }
  }

  function clearSearchResults() {
    searchInput.value = '';
    searchMatches = [];
    currentMatchIndex = -1;
    searchInfo.textContent = '-';
    prevMatch.disabled = true;
    nextMatch.disabled = true;
  }

  searchBtn.addEventListener('click', performSearch);
  
  searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      performSearch();
    }
  });

  clearSearch.addEventListener('click', clearSearchResults);

  prevMatch.addEventListener('click', async () => {
    if (currentMatchIndex > 0) {
      currentMatchIndex--;
      searchInfo.textContent = `${currentMatchIndex + 1} of ${searchMatches.length}`;
      await renderPage(searchMatches[currentMatchIndex]);
    }
  });

  nextMatch.addEventListener('click', async () => {
    if (currentMatchIndex < searchMatches.length - 1) {
      currentMatchIndex++;
      searchInfo.textContent = `${currentMatchIndex + 1} of ${searchMatches.length}`;
      await renderPage(searchMatches[currentMatchIndex]);
    }
  });

  // Download PDF
  downloadPdf.addEventListener('click', () => {
    const link = document.createElement('a');
    link.href = PDF_FILENAME;
    link.download = PDF_FILENAME;
    link.click();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    // Ctrl/Cmd + F to focus search
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
      e.preventDefault();
      searchInput.focus();
    }
    
    // Escape to clear search
    if (e.key === 'Escape' && document.activeElement === searchInput) {
      clearSearchResults();
    }

    // Arrow keys for page navigation (when not in search input)
    if (document.activeElement !== searchInput) {
      if (e.key === 'ArrowLeft' && currentPage > 1) {
        renderPage(currentPage - 1);
      } else if (e.key === 'ArrowRight' && currentPage < totalPages) {
        renderPage(currentPage + 1);
      }
    }
  });

  // Initialize
  loadPDF();
</script>
</body>
</html>
