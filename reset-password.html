<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password - Bromar Hub</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ea580c">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="tools/bromar-hub.css">
    <style>
        body {
            padding-bottom: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .reset-box {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow: 0 12px 32px var(--shadow);
            max-width: 440px;
            width: 100%;
            border: 1px solid var(--border);
        }

        .reset-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .reset-logo img {
            max-width: 200px;
            height: auto;
        }

        .reset-title {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .reset-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input {
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3);
        }

        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .password-requirements {
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.875rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
        }

        .password-requirements h4 {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
            color: var(--text-primary);
        }

        .password-requirements ul {
            list-style: none;
            padding: 0;
        }

        .password-requirements li {
            color: var(--text-secondary);
            padding: 0.15rem 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .password-requirements li.met {
            color: var(--success);
        }

        .password-requirements li::before {
            content: '○';
            font-weight: 600;
        }

        .password-requirements li.met::before {
            content: '✓';
        }

        .error-message {
            background: var(--error-bg);
            color: var(--error);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            border: 1px solid var(--error-border);
        }

        .success-message {
            background: var(--success-bg);
            color: var(--success);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            border: 1px solid var(--success-border);
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .loading-state {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="reset-box">
        <div class="reset-logo">
            <img src="Bromar-Primary-Logo-Full-Colour.png" alt="Bromar Electrical" class="logo-image light-logo">
            <img src="Bromar-Primary-Logo-Reverse-White.png" alt="Bromar Electrical" class="logo-image dark-logo">
        </div>
        
        <h1 class="reset-title">Reset Password</h1>
        <p class="reset-subtitle">Enter your new password below</p>
        
        <div id="errorMsg" style="display: none;"></div>
        <div id="successMsg" style="display: none;"></div>

        <div id="loadingState" class="loading-state">
            Verifying reset link...
        </div>
        
        <form id="resetForm" style="display: none;">
            <div class="password-requirements">
                <h4>Password Requirements:</h4>
                <ul>
                    <li id="req-length">At least 8 characters</li>
                    <li id="req-upper">One uppercase letter</li>
                    <li id="req-lower">One lowercase letter</li>
                    <li id="req-number">One number</li>
                </ul>
            </div>

            <div class="form-group">
                <label class="form-label" for="newPassword">New Password</label>
                <input 
                    type="password" 
                    id="newPassword" 
                    class="form-input" 
                    placeholder="Enter new password"
                    required
                    autocomplete="new-password"
                />
            </div>
            
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm New Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    class="form-input" 
                    placeholder="Re-enter new password"
                    required
                    autocomplete="new-password"
                />
            </div>
            
            <button type="submit" id="submitBtn" class="submit-btn" disabled>Reset Password</button>
        </form>
        
        <div class="back-link">
            <a href="/index.html">← Back to login</a>
        </div>
    </div>

    <div class="revision-number">V1.00</div>

    <script>
        const SUPABASE_URL = 'https://iwtvlpfprxqwveqadlwl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3dHZscGZwcnhxd3ZlcWFkbHdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzczMDQsImV4cCI6MjA5MzExMzMwNH0.X6tOhxgFnJDDipltIuILOaZRv4bM4RE9kVV1R_UsE5k';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true,
                storage: window.localStorage,
            }
        });

        // Apply theme
        const savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Apply font size
        const savedFontSize = localStorage.getItem('fontSize') || 'normal';
        const fontSizes = { small: '14px', normal: '16px', large: '18px', xlarge: '20px' };
        document.documentElement.style.fontSize = fontSizes[savedFontSize] || fontSizes.normal;

        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loadingState = document.getElementById('loadingState');
        const resetForm = document.getElementById('resetForm');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');

        // Handle the reset link
        // Supabase puts the token in the URL hash when user clicks reset link
        (async () => {
            // Wait a moment for Supabase to process the URL hash
            setTimeout(async () => {
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                if (session) {
                    // Valid reset session - show form
                    loadingState.style.display = 'none';
                    resetForm.style.display = 'block';
                } else {
                    // No session - link expired or invalid
                    loadingState.style.display = 'none';
                    errorMsg.className = 'error-message';
                    errorMsg.textContent = 'This reset link is invalid or has expired. Please request a new one.';
                    errorMsg.style.display = 'block';
                }
            }, 500);
        })();

        // Password validation
        const requirements = {
            length: { el: document.getElementById('req-length'), test: (p) => p.length >= 8 },
            upper:  { el: document.getElementById('req-upper'),  test: (p) => /[A-Z]/.test(p) },
            lower:  { el: document.getElementById('req-lower'),  test: (p) => /[a-z]/.test(p) },
            number: { el: document.getElementById('req-number'), test: (p) => /[0-9]/.test(p) }
        };

        function validatePassword() {
            const password = newPassword.value;
            const confirmVal = confirmPassword.value;
            
            let metCount = 0;
            for (const key in requirements) {
                const met = requirements[key].test(password);
                requirements[key].el.classList.toggle('met', met);
                if (met) metCount++;
            }

            const allMet = metCount === 4 && password === confirmVal && confirmVal.length > 0;
            submitBtn.disabled = !allMet;
        }

        newPassword.addEventListener('input', validatePassword);
        confirmPassword.addEventListener('input', validatePassword);

        // Submit handler
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating...';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword.value
                });

                if (error) {
                    errorMsg.className = 'error-message';
                    errorMsg.textContent = 'Error: ' + error.message;
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                } else {
                    successMsg.className = 'success-message';
                    successMsg.textContent = 'Password updated successfully! Redirecting to login...';
                    successMsg.style.display = 'block';
                    resetForm.style.display = 'none';
                    
                    // Sign out and redirect to login
                    setTimeout(async () => {
                        await supabaseClient.auth.signOut();
                        window.location.href = '/index.html';
                    }, 2000);
                }
            } catch (err) {
                errorMsg.className = 'error-message';
                errorMsg.textContent = 'An unexpected error occurred. Please try again.';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
