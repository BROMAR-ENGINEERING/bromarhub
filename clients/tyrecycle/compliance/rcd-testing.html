<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>RCD Testing | Tyrecycle Somerton | Bromar</title>

<link rel="stylesheet" href="/tools/bromar-hub.css"/>
<script src="/tools/bromar-hub.js" defer></script>

<style>
  /* ── PAGE-SPECIFIC ── */
  html.guarding body { visibility: hidden; }
  .page-wrapper, .page-title-wrapper { max-width: 960px; }

  .view-tabs { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .view-tab { padding: 0.65rem 1.1rem; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 0.92rem; color: var(--text-secondary); }
  .view-tab:hover { color: var(--text-primary); }
  .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 600; color: var(--accent); background: none; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; padding: 0; margin-bottom: 1rem; }
  .back-link:hover { text-decoration: underline; }

  .tools { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .tools input[type="text"] { flex: 1; min-width: 200px; }
  .tools .count { font-size: 0.85rem; color: var(--text-secondary); }
  .chk { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; margin: 0; cursor: pointer; }
  .chk input { width: 17px; height: 17px; accent-color: var(--accent); }

  .source-line { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem; }
  .source-line strong { color: var(--text-primary); font-weight: 600; }
  .source-line a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .source-line a:hover { text-decoration: underline; }

  /* Report list */
  .report-row {
    display: grid; grid-template-columns: 1.3fr 1.4fr 1fr auto; gap: 1rem; align-items: center;
    width: 100%; text-align: left; font-family: 'Outfit', sans-serif; color: var(--text-primary);
    padding: 1rem 1.25rem; background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 0.6rem; cursor: pointer; transition: border-color 0.2s;
  }
  .report-row:hover { border-color: var(--accent); }
  .rr-cert { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--accent); font-size: 0.9rem; word-break: break-all; }
  .rr-sub { font-size: 0.78rem; color: var(--text-secondary); }
  .rr-site { font-weight: 600; font-size: 0.92rem; }
  .rr-counts { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 680px) { .report-row { grid-template-columns: 1fr; gap: 0.4rem; } .rr-counts { justify-content: flex-start; } }

  .cnt { padding: 2px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cnt.pass { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }
  .cnt.fail { background: var(--error-bg); color: var(--error); border-color: var(--error-border); }
  .cnt.oos  { background: rgba(217,119,6,0.12); color: #b45309; border-color: rgba(217,119,6,0.35); }
  [data-theme="dark"] .cnt.oos { color: #fbbf24; }

  .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); font-size: 0.9rem; border: 1px dashed var(--border); border-radius: 12px; }

  /* Detail */
  .detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .detail-top h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
  .detail-top .cert { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 600; font-size: 0.9rem; }
  .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.9rem 1.5rem; margin-bottom: 1.5rem; }
  .m-label { font-size: 0.75rem; color: var(--text-secondary); }
  .m-val { font-size: 0.92rem; font-weight: 600; word-break: break-word; }
  @media (max-width: 680px) { .meta-grid { grid-template-columns: 1fr 1fr; } }

  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; margin-bottom: 1.5rem; }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 0.5rem; text-align: center; background: var(--bg-main); }
  .tile-num { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tile-num.sm { font-size: 1rem; line-height: 1.75; }
  .tile-label { font-size: 0.72rem; color: var(--text-secondary); }
  .tile.pass .tile-num { color: var(--success); }
  .tile.fail .tile-num { color: var(--error); }
  .tile.oos .tile-num { color: #d97706; }
  @media (max-width: 680px) { .tiles { grid-template-columns: repeat(3, 1fr); } }

  .sub-head { font-size: 1.05rem; font-weight: 600; margin: 1.75rem 0 0.75rem; }
  .note-box { background: var(--bg-main); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.875rem; margin-bottom: 1.5rem; white-space: pre-wrap; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 0.84rem; min-width: 680px; }
  table.data th { text-align: left; font-weight: 600; font-size: 0.76rem; color: var(--text-secondary); background: var(--bg-main); padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.data td { padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.data tr:last-child td { border-bottom: none; }
  table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data td.mono { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }
  table.data tr.row-fail td { background: var(--error-bg); }
  table.data tr.row-oos td { background: rgba(217,119,6,0.10); }
  .state { font-weight: 700; font-size: 0.78rem; }
  .state.pass { color: var(--success); }
  .state.fail { color: var(--error); }
  .state.oos  { color: #d97706; }
  .state.na   { color: var(--text-secondary); }
  .overdue { color: var(--error); font-weight: 700; }

  /* In-card footer */
  .card-footer { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); text-align: center; }
  .card-footer-title { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.8px; color: var(--text-primary); margin-bottom: 10px; white-space: nowrap; }
  @media (max-width: 420px) { .card-footer-title { font-size: 0.8rem; letter-spacing: 0.4px; } }
  .card-footer-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 14px; }
  .card-footer-link:hover { text-decoration: underline; }
  .card-footer-version { font-size: 0.78rem; color: var(--text-secondary); font-weight: 500; opacity: 0.7; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<script>document.documentElement.classList.add('guarding');</script>
</head>

<script>
(function () {
  const CLIENT_SLUG = 'tyrecycle';
  const SECTION     = 'rcd_testing';
  const PORTAL_URL  = '/clients/tyrecycle/compliance/index.html';
  const TABLE       = 'test_tag_reports';
  const BUCKET      = 'test-tag-reports';

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dash = v => (v === null || v === undefined || v === '') ? '—' : v;

  let REPORTS = [];
  let CURRENT = null;
  let LATEST = null;   // latest report (full row) for the register

  function niceDate(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return isNaN(d) ? ts : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  // YYYY-MM-DD, DD/MM/YYYY, DD-MM-YYYY → ISO
  function toISO(v) {
    if (!v) return null;
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
    if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    return null;
  }
  function stateOf(a) {
    const s = String(a.state || '').toLowerCase();
    return ['pass', 'fail', 'oos', 'na'].includes(s) ? s : 'na';
  }
  const STATE_LABEL = { pass: 'Pass', fail: 'Fail', oos: 'Out of service', na: 'N/A' };

  // ── AUTH GUARD ──
  async function guard() {
    const sb = window.sb;
    if (!sb) { window.location.replace(PORTAL_URL); return null; }
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.replace(PORTAL_URL); return null; }
    const meta = session.user.app_metadata || {};
    if (meta.role !== 'client') return { allowed: true };
    if (meta.client !== CLIENT_SLUG) { await sb.auth.signOut(); window.location.replace(PORTAL_URL); return null; }
    const { data: cu, error } = await sb.from('client_users').select('sections, active').eq('user_id', session.user.id).maybeSingle();
    if (error || !cu || !cu.active) { await sb.auth.signOut(); window.location.replace(PORTAL_URL); return null; }
    return { allowed: (cu.sections || []).includes(SECTION) };
  }

  // ── DATA ──
  async function loadReports() {
    const { data, error } = await window.sb.from(TABLE)
      .select('id, cert_no, job_number, site_name, date_range, generated_date, total, pass, fail, oos, overdue, pdf_path, updated_at')
      .eq('client_slug', CLIENT_SLUG)
      .order('updated_at', { ascending: false });
    if (error) throw error;
    REPORTS = data || [];
  }

  async function loadLatestFull() {
    if (!REPORTS.length) { LATEST = null; return; }
    const { data, error } = await window.sb.from(TABLE).select('*').eq('id', REPORTS[0].id).maybeSingle();
    if (error) throw error;
    LATEST = data;
  }

  // ── REGISTER ──
  function renderRegister() {
    const body = $('registerBody');
    if (!LATEST) {
      body.innerHTML = '<div class="empty-state">No RCD reports yet. The register will appear after Bromar\'s next visit.</div>';
      return;
    }
    const assets = (LATEST.report_data && Array.isArray(LATEST.report_data.assets)) ? LATEST.report_data.assets : [];
    if (!assets.length) {
      body.innerHTML = '<div class="empty-state">The latest report has no individual RCD records. Open it from the Reports tab for the PDF.</div>';
      return;
    }
    const today = todayISO();
    const dueISOs = assets.map(a => toISO(a.due)).filter(Boolean).sort();
    const overdueCount = assets.filter(a => { const d = toISO(a.due); return d && d < today; }).length;
    const n = s => assets.filter(a => stateOf(a) === s).length;

    body.innerHTML = `
      <div class="source-line">From certificate <a href="#report=${esc(LATEST.id)}">${esc(LATEST.cert_no)}</a>, issued <strong>${esc(LATEST.generated_date || niceDate(LATEST.updated_at))}</strong></div>
      <div class="tiles">
        <div class="tile"><div class="tile-num">${assets.length}</div><div class="tile-label">RCDs</div></div>
        <div class="tile pass"><div class="tile-num">${n('pass')}</div><div class="tile-label">Pass</div></div>
        <div class="tile fail"><div class="tile-num">${n('fail')}</div><div class="tile-label">Fail</div></div>
        <div class="tile oos"><div class="tile-num">${n('oos')}</div><div class="tile-label">Out of service</div></div>
        <div class="tile ${overdueCount ? 'fail' : ''}"><div class="tile-num">${overdueCount}</div><div class="tile-label">Overdue</div></div>
        <div class="tile"><div class="tile-num sm">${esc(dueISOs[0] ? niceDate(dueISOs[0] + 'T00:00:00') : '—')}</div><div class="tile-label">Next due</div></div>
      </div>
      <div class="tools">
        <input type="text" id="regSearch" placeholder="Search location, barcode, asset or description" aria-label="Search register"/>
        <label class="chk"><input type="checkbox" id="regIssues"/> Issues only</label>
        <span class="count" id="regCount"></span>
      </div>
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th>Location</th><th>Barcode</th><th>Asset no.</th><th>Description</th><th>Last result</th><th>Trip time</th><th>Last tested</th><th>Next due</th></tr></thead>
          <tbody id="regRows"></tbody>
        </table>
      </div>`;

    const draw = () => {
      const q = ($('regSearch').value || '').trim().toLowerCase();
      const issues = $('regIssues').checked;
      const rows = assets.filter(a => {
        const s = stateOf(a), d = toISO(a.due);
        if (issues && !(s === 'fail' || s === 'oos' || (d && d < today))) return false;
        return !q || [a.location, a.sublocation, a.barcode, a.assetNo, a.description].some(v => String(v || '').toLowerCase().includes(q));
      });
      $('regCount').textContent = `${rows.length} of ${assets.length}`;
      $('regRows').innerHTML = rows.length ? rows.map(a => {
        const s = stateOf(a), d = toISO(a.due), late = d && d < today;
        return `
          <tr class="${s === 'fail' ? 'row-fail' : s === 'oos' ? 'row-oos' : ''}">
            <td>${esc(dash([a.location, a.sublocation].filter(Boolean).join(' / ')))}</td>
            <td class="mono">${esc(dash(a.barcode))}</td>
            <td class="mono">${esc(dash(a.assetNo))}</td>
            <td>${esc(dash(a.description))}</td>
            <td><span class="state ${s}">${esc(a.status || STATE_LABEL[s])}</span></td>
            <td class="mono">${esc(dash(a.measure))}</td>
            <td>${esc(dash(a.tested))}</td>
            <td class="${late ? 'overdue' : ''}">${esc(dash(a.due))}${late ? ' · overdue' : ''}</td>
          </tr>`;
      }).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--text-secondary);padding:1rem;">Nothing matches. Clear the search or untick the filter.</td></tr>';
    };
    $('regSearch').addEventListener('input', draw);
    $('regIssues').addEventListener('change', draw);
    draw();
  }

  // ── REPORT LIST ──
  function renderList() {
    if (!$('search')) return;
    const q = ($('search').value || '').trim().toLowerCase();
    const rows = REPORTS.filter(r => !q || [r.cert_no, r.site_name, r.job_number].some(v => String(v || '').toLowerCase().includes(q)));
    $('listCount').textContent = REPORTS.length ? `${rows.length} of ${REPORTS.length} reports` : '';
    if (!REPORTS.length) { $('reportList').innerHTML = '<div class="empty-state">No RCD reports yet. They\'ll appear here after Bromar\'s next visit.</div>'; return; }
    if (!rows.length) { $('reportList').innerHTML = '<div class="empty-state">No reports match that search. Try a certificate number, site or job number.</div>'; return; }
    $('reportList').innerHTML = rows.map(r => `
      <button type="button" class="report-row" data-id="${esc(r.id)}">
        <div><div class="rr-cert">${esc(dash(r.cert_no))}</div><div class="rr-sub">${r.job_number ? 'Job ' + esc(r.job_number) : ''}</div></div>
        <div><div class="rr-site">${esc(dash(r.site_name))}</div><div class="rr-sub">${esc(dash(r.date_range))}</div></div>
        <div><div class="rr-sub">Issued</div><div style="font-size:0.88rem;">${esc(r.generated_date || niceDate(r.updated_at))}</div></div>
        <div class="rr-counts">
          <span class="cnt">${esc(r.total ?? 0)} tested</span>
          <span class="cnt pass">${esc(r.pass ?? 0)} pass</span>
          ${r.fail ? `<span class="cnt fail">${esc(r.fail)} fail</span>` : ''}
          ${r.oos ? `<span class="cnt oos">${esc(r.oos)} OOS</span>` : ''}
        </div>
      </button>`).join('');
  }

  // ── REPORT DETAIL ──
  async function openDetail(id) {
    $('detailBody').innerHTML = '<div class="empty-state">Loading report…</div>';
    const { data, error } = await window.sb.from(TABLE).select('*')
      .eq('id', id).eq('client_slug', CLIENT_SLUG).maybeSingle();
    if (error || !data) {
      if (error) console.error('[rcd] detail', error);
      $('detailBody').innerHTML = '<div class="empty-state">This report isn\'t available. Go back to the list and choose another.</div>';
      return;
    }
    CURRENT = data;
    renderDetail();
  }

  function renderDetail() {
    const r = CURRENT;
    const assets = (r.report_data && Array.isArray(r.report_data.assets)) ? r.report_data.assets : [];
    const groups = {};
    assets.forEach(a => {
      const key = (a.location || '—') + '||' + (a.sublocation || '');
      const g = groups[key] || (groups[key] = { location: a.location || '—', sub: a.sublocation || '', total: 0, pass: 0, fail: 0, oos: 0 });
      g.total++;
      const s = stateOf(a);
      if (s === 'pass') g.pass++; else if (s === 'fail') g.fail++; else if (s === 'oos') g.oos++;
    });
    const locRows = Object.values(groups).sort((a, b) => (a.location + a.sub).localeCompare(b.location + b.sub));
    const meta = [
      ['Customer', r.customer], ['Site', r.site_name], ['Site address', r.site_address],
      ['Contact', [r.contact, r.contact_email].filter(Boolean).join(' · ')], ['Test period', r.date_range], ['Tested by', r.tested_by],
      ['Job number', r.job_number], ['Installation type', r.installation_type], ['Issued', r.generated_date || niceDate(r.updated_at)]
    ];

    $('detailBody').innerHTML = `
      <div class="detail-top">
        <div><div class="cert">${esc(dash(r.cert_no))}</div><h2>RCD test report</h2></div>
        ${r.pdf_path ? '<button type="button" class="submit-btn" id="pdfBtn">Download PDF</button>' : ''}
      </div>
      <div class="meta-grid">${meta.map(([l, v]) => `<div><div class="m-label">${esc(l)}</div><div class="m-val">${esc(dash(v))}</div></div>`).join('')}</div>
      <div class="tiles">
        <div class="tile"><div class="tile-num">${esc(r.total ?? assets.length)}</div><div class="tile-label">Tested</div></div>
        <div class="tile pass"><div class="tile-num">${esc(r.pass ?? 0)}</div><div class="tile-label">Pass</div></div>
        <div class="tile fail"><div class="tile-num">${esc(r.fail ?? 0)}</div><div class="tile-label">Fail</div></div>
        <div class="tile oos"><div class="tile-num">${esc(r.oos ?? 0)}</div><div class="tile-label">Out of service</div></div>
        <div class="tile"><div class="tile-num">${esc(r.boards ?? 0)}</div><div class="tile-label">Boards</div></div>
        <div class="tile ${r.overdue ? 'fail' : ''}"><div class="tile-num">${esc(r.overdue ?? 0)}</div><div class="tile-label">Overdue</div></div>
      </div>
      ${r.note ? `<div class="note-box">${esc(r.note)}</div>` : ''}
      ${locRows.length ? `
        <h3 class="sub-head">Location summary</h3>
        <div class="table-scroll"><table class="data">
          <thead><tr><th>Location</th><th>Sub-location</th><th>Tested</th><th>Pass</th><th>Fail</th><th>OOS</th></tr></thead>
          <tbody>${locRows.map(g => `
            <tr class="${g.fail ? 'row-fail' : g.oos ? 'row-oos' : ''}">
              <td>${esc(g.location)}</td><td>${esc(dash(g.sub))}</td>
              <td class="num">${g.total}</td><td class="num">${g.pass}</td><td class="num">${g.fail}</td><td class="num">${g.oos}</td>
            </tr>`).join('')}</tbody>
        </table></div>` : ''}
      <h3 class="sub-head">Results by RCD</h3>
      ${assets.length ? `
        <div class="tools">
          <input type="text" id="assetSearch" placeholder="Search location, barcode, asset or description" aria-label="Search results"/>
          <label class="chk"><input type="checkbox" id="issuesOnly"/> Fail and out of service only</label>
        </div>
        <div class="table-scroll"><table class="data">
          <thead><tr><th>Location</th><th>Barcode</th><th>Asset no.</th><th>Description</th><th>Test performed</th><th>Trip time / result</th><th>Status</th><th>Next due</th></tr></thead>
          <tbody id="assetRows"></tbody>
        </table></div>` : '<div class="empty-state">No individual results are stored with this report. Download the PDF for the full record.</div>'}`;

    if (r.pdf_path) $('pdfBtn').addEventListener('click', openPdf);
    if (assets.length) {
      const draw = () => {
        const q = ($('assetSearch').value || '').trim().toLowerCase();
        const issues = $('issuesOnly').checked;
        const rows = assets.filter(a => {
          const s = stateOf(a);
          if (issues && s !== 'fail' && s !== 'oos') return false;
          return !q || [a.location, a.sublocation, a.barcode, a.assetNo, a.description].some(v => String(v || '').toLowerCase().includes(q));
        });
        $('assetRows').innerHTML = rows.length ? rows.map(a => {
          const s = stateOf(a);
          return `
            <tr class="${s === 'fail' ? 'row-fail' : s === 'oos' ? 'row-oos' : ''}">
              <td>${esc(dash([a.location, a.sublocation].filter(Boolean).join(' / ')))}</td>
              <td class="mono">${esc(dash(a.barcode))}</td><td class="mono">${esc(dash(a.assetNo))}</td>
              <td>${esc(dash(a.description))}</td><td>${esc(dash(a.testPerformed))}</td>
              <td class="mono">${esc(dash(a.measure))}</td>
              <td><span class="state ${s}">${esc(a.status || STATE_LABEL[s])}</span></td>
              <td>${esc(dash(a.due))}</td>
            </tr>`;
        }).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--text-secondary);padding:1rem;">No results match. Clear the search or untick the filter.</td></tr>';
      };
      $('assetSearch').addEventListener('input', draw);
      $('issuesOnly').addEventListener('change', draw);
      draw();
    }
  }

  // ── PDF (issued copy of record — signed URL, never regenerated) ──
  async function openPdf() {
    const btn = $('pdfBtn');
    const win = window.open('', '_blank');
    btn.disabled = true; btn.textContent = 'Opening…';
    const { data, error } = await window.sb.storage.from(BUCKET).createSignedUrl(CURRENT.pdf_path, 300);
    btn.disabled = false; btn.textContent = 'Download PDF';
    if (error || !data?.signedUrl) {
      if (win) win.close();
      console.error('[rcd] pdf', error);
      BromarHub.showInfo('The PDF couldn\'t be opened. Try again, or contact Bromar for a copy.');
      return;
    }
    if (win) win.location.href = data.signedUrl; else window.location.href = data.signedUrl;
  }

  // ── ROUTING: #register (default) | #reports | #report=<id> ──
  function show(view) {
    $('registerView').hidden = view !== 'register';
    $('listView').hidden = view !== 'reports';
    $('detailView').hidden = view !== 'detail';
    document.querySelectorAll('.view-tab').forEach(t =>
      t.classList.toggle('active', t.dataset.view === (view === 'detail' ? 'reports' : view)));
  }
  function route() {
    const h = window.location.hash;
    const m = h.match(/report=([0-9a-f-]{36})/i);
    if (m) { show('detail'); window.scrollTo(0, 0); openDetail(m[1]); }
    else if (h === '#reports') { show('reports'); renderList(); }
    else { show('register'); }
  }

  // ── INIT ──
  document.addEventListener('DOMContentLoaded', async () => {
    const who = await guard();
    if (!who) return;
    document.documentElement.classList.remove('guarding');

    if (!who.allowed) {
      $('main').innerHTML = '<div class="empty-state">Your account doesn\'t include RCD testing records. Contact Bromar to add them.</div>';
      return;
    }

    document.querySelectorAll('.view-tab').forEach(t =>
      t.addEventListener('click', () => { window.location.hash = t.dataset.view; }));
    $('search').addEventListener('input', renderList);
    $('reportList').addEventListener('click', e => {
      const row = e.target.closest('.report-row');
      if (row) window.location.hash = 'report=' + row.dataset.id;
    });
    $('backBtn').addEventListener('click', () => { window.location.hash = 'reports'; });
    window.addEventListener('hashchange', route);

    try {
      await loadReports();
      await loadLatestFull();
    } catch (err) {
      console.error('[rcd] load', err);
      const msg = '<div class="empty-state">Records couldn\'t load. Refresh the page to try again.</div>';
      $('registerBody').innerHTML = msg;
      $('main').querySelector('#listView').innerHTML = msg;
      route();
      return;
    }
    renderRegister();
    route();
  });
})();
</script>
</body>
</html>
