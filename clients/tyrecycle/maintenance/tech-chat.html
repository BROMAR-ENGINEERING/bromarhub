<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tyrecycle — Tech Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/tools/auth.js"></script>
<link rel="stylesheet" href="/tools/bromar-hub.css"/>
<script src="/tools/bromar-hub.js" defer></script>

<style>
  /* ── PAGE-SPECIFIC (chat / notice board) ── */
  .page-wrapper { margin-top: 90px; max-width: 820px; }
  @media (max-width: 520px) { .page-wrapper { margin-top: 80px; } }

  /* Stat chips */
  .stat-row { display: flex; gap: 0.625rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .stat-chip {
    display: flex; align-items: center; gap: 0.5rem;
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 12px; padding: 0.625rem 0.875rem; font-size: 0.85rem; font-weight: 600;
  }
  .stat-chip .num { font-size: 1.1rem; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
  .stat-chip.alert { border-color: var(--accent); background: var(--card-hover); }

  /* Mention banner */
  .mention-banner {
    display: none; align-items: center; gap: 0.75rem;
    background: var(--card-hover); border: 1px solid var(--accent);
    border-radius: 12px; padding: 0.875rem 1.125rem; margin-bottom: 1.25rem;
    font-size: 0.9rem; font-weight: 600;
  }
  .mention-banner.show { display: flex; }
  .mention-banner .mb-actions { margin-left: auto; display: flex; gap: 0.5rem; }
  .mb-btn {
    font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 600;
    padding: 0.4rem 0.85rem; border-radius: 8px; cursor: pointer; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
  }
  .mb-btn.ghost { background: transparent; color: var(--accent); }

  /* Composer */
  .composer { margin-bottom: 1.5rem; padding: 1.5rem; }
  .reply-context {
    display: none; align-items: center; gap: 0.5rem; font-size: 0.82rem; font-weight: 600;
    color: var(--accent); background: var(--card-hover); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.5rem 0.75rem; margin-bottom: 0.875rem;
  }
  .reply-context.show { display: flex; }
  .reply-context .rc-cancel { margin-left: auto; cursor: pointer; color: var(--text-secondary); font-weight: 700; }

  .composer-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 0.875rem; margin-top: 0.875rem; }
  @media (max-width: 620px) { .composer-tools { grid-template-columns: 1fr; } }

  .mini-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 0.4rem; }

  .chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.5rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 14px; font-size: 0.78rem; font-weight: 600;
    background: var(--bg-main); border: 1px solid var(--border);
  }
  .chip.topic { color: var(--accent); border-color: var(--accent); }
  .chip.mention { color: var(--info-text); background: var(--info-bg); border-color: var(--info-border); }
  .chip .x { cursor: pointer; font-weight: 800; opacity: 0.6; }
  .chip .x:hover { opacity: 1; }

  .suggest-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.5rem; }
  .suggest {
    padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 600;
    background: transparent; border: 1px dashed var(--border); color: var(--text-secondary); cursor: pointer;
  }
  .suggest:hover { border-color: var(--accent); color: var(--accent); }

  .question-toggle { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.875rem; font-size: 0.875rem; font-weight: 600; }
  .question-toggle input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  .composer-actions { display: flex; justify-content: flex-end; margin-top: 1rem; }

  /* Filter panel */
  .filter-bar { margin-bottom: 1.25rem; }
  .filter-toggle {
    display: flex; align-items: center; gap: 0.5rem; width: 100%;
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.75rem 1rem; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--text-primary);
  }
  .filter-toggle .arrow { margin-left: auto; transition: transform 0.25s; }
  .filter-toggle.open .arrow { transform: rotate(180deg); }
  .filter-panel { display: none; margin-top: 0.75rem; padding: 1.25rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; }
  .filter-panel.show { display: block; }
  .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.875rem; }
  @media (max-width: 620px) { .filter-grid { grid-template-columns: 1fr; } }
  .filter-checks { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-top: 0.875rem; }
  .filter-checks label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 600; margin: 0; cursor: pointer; }
  .filter-checks input { width: 16px; height: 16px; accent-color: var(--accent); }
  .clear-filters { background: none; border: none; color: var(--accent); font-weight: 600; font-size: 0.82rem; cursor: pointer; margin-top: 0.875rem; }

  /* Feed */
  .feed { display: flex; flex-direction: column; gap: 0.875rem; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
  .empty-state .big { font-size: 2.5rem; margin-bottom: 0.5rem; }

  .msg {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.125rem 1.25rem; transition: border-color 0.2s;
  }
  .msg.mine-mention { border-color: var(--accent); }
  .msg-head { display: flex; align-items: center; gap: 0.625rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
  .msg-author { font-weight: 700; font-size: 0.95rem; }
  .msg-time { font-size: 0.75rem; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; }
  .q-badge { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 10px; background: var(--info-bg); color: var(--info-text); border: 1px solid var(--info-border); }
  .q-badge.resolved { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }
  .msg-body { font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.75rem; }
  .msg-actions { display: flex; gap: 0.875rem; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
  .msg-act { background: none; border: none; color: var(--text-secondary); font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 0; }
  .msg-act:hover { color: var(--accent); }
  .msg-act.danger:hover { color: var(--error); }

  .clickable-topic { cursor: pointer; }
  .clickable-topic:hover { background: var(--card-hover); }

  .replies { margin-top: 0.875rem; margin-left: 1rem; padding-left: 1rem; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 0.625rem; }
  .msg.reply { padding: 0.875rem 1rem; border-radius: 10px; background: var(--bg-main); }

  .inline-edit textarea { margin-bottom: 0.5rem; }
  .inline-edit-actions { display: flex; gap: 0.5rem; }
  .inline-edit-actions button { font-size: 0.8rem; padding: 0.4rem 0.9rem; border-radius: 8px; }
</style>
</head>
<body>

<div id="bromar-header"></div>

<div class="success-banner" id="successBanner"><span id="successText"></span></div>
<div class="info-banner" id="infoBanner"><span id="infoBannerText"></span></div>

<div class="page-title-wrapper">
  <h1>Tech Chat</h1>
  <p class="subtitle">Leave notes, ask questions, tag the team — Tyrecycle Somerton</p>
</div>

<div class="page-wrapper">

  <!-- Unread mentions -->
  <div class="mention-banner" id="mentionBanner">
    <span>🔔</span>
    <span id="mentionBannerText">You have new mentions</span>
    <div class="mb-actions">
      <button class="mb-btn" id="viewMentionsBtn">View</button>
      <button class="mb-btn ghost" id="dismissMentionsBtn">Mark read</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stat-row" id="statRow"></div>

  <!-- Composer -->
  <div class="form-card composer">
    <div class="reply-context" id="replyContext">
      <span id="replyContextText"></span>
      <span class="rc-cancel" id="replyCancel">✕ cancel</span>
    </div>

    <div class="field-group">
      <label for="post_as">Posting as</label>
      <select id="post_as"><option value="">Select your name...</option></select>
    </div>

    <div class="field-group full">
      <label for="msg_body">Note / question</label>
      <textarea id="msg_body" placeholder="Write a note for the team, or ask a question…"></textarea>
    </div>

    <div class="composer-tools">
      <div>
        <div class="mini-label">Topics</div>
        <input type="text" id="topic_input" placeholder="Type a topic + Enter"/>
        <div class="chip-wrap" id="topicChips"></div>
        <div class="suggest-row" id="topicSuggest"></div>
      </div>
      <div>
        <div class="mini-label">Tag people</div>
        <select id="mention_select"><option value="">Add a person…</option></select>
        <div class="chip-wrap" id="mentionChips"></div>
      </div>
    </div>

    <label class="question-toggle"><input type="checkbox" id="is_question"/> Mark as a question</label>

    <div class="composer-actions">
      <button class="submit-btn" id="postBtn">Post note</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <div class="filter-toggle" id="filterToggle">
      🔎 Search &amp; filter history <span class="arrow">▾</span>
    </div>
    <div class="filter-panel" id="filterPanel">
      <div class="filter-grid">
        <div class="field-group" style="margin:0;">
          <label for="search_text">Search text</label>
          <input type="text" id="search_text" placeholder="Search notes, authors, topics…"/>
        </div>
        <div class="field-group" style="margin:0;">
          <label for="filter_topic">Topic</label>
          <select id="filter_topic"><option value="">All topics</option></select>
        </div>
        <div class="field-group" style="margin:0;">
          <label for="filter_author">Author</label>
          <select id="filter_author"><option value="">All authors</option></select>
        </div>
      </div>
      <div class="filter-checks">
        <label><input type="checkbox" id="only_questions"/> Questions only</label>
        <label><input type="checkbox" id="only_open"/> Unresolved only</label>
        <label><input type="checkbox" id="only_mentions"/> Mentioning me</label>
      </div>
      <button class="clear-filters" id="clearFilters">Clear all filters</button>
    </div>
  </div>

  <!-- Feed -->
  <div class="feed" id="feed"></div>

</div>

<div class="revision-number">V1.00</div>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const esc = s => window.BromarHub ? BromarHub.escapeHtml(s) : String(s);

  const NOTIFY_ENDPOINT = '/.netlify/functions/tyrecycle-chat-notify';

  let ALL = [];
  let selectedTopics = [];
  let selectedMentions = [];   // [{name,email}]
  let replyTo = null;          // {id, author}
  let editingId = null;

  const state = {
    search: '', topic: '', author: '',
    onlyQuestions: false, onlyOpen: false, onlyMentions: false
  };

  function me() { return (window.currentUser?.email || '').toLowerCase(); }

  /* ── TIME ── */
  function fmtTime(iso) {
    const d = new Date(iso), now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short' }) + ' ' +
           d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
  }

  /* ── COMPOSER: TOPICS ── */
  function renderTopicChips() {
    $('#topicChips').innerHTML = selectedTopics.map((t, i) =>
      `<span class="chip topic">#${esc(t)} <span class="x" data-i="${i}">✕</span></span>`).join('');
    $('#topicChips').querySelectorAll('.x').forEach(x =>
      x.onclick = () => { selectedTopics.splice(+x.dataset.i, 1); renderTopicChips(); });
  }
  function addTopic(raw) {
    const t = (raw || '').trim().replace(/^#/, '');
    if (!t) return;
    if (!selectedTopics.some(x => x.toLowerCase() === t.toLowerCase())) selectedTopics.push(t);
    $('#topic_input').value = '';
    renderTopicChips();
  }
  function renderTopicSuggestions() {
    const all = [...new Set(ALL.flatMap(m => m.topics || []))].sort();
    $('#topicSuggest').innerHTML = all.slice(0, 12)
      .map(t => `<span class="suggest" data-t="${esc(t)}">#${esc(t)}</span>`).join('');
    $('#topicSuggest').querySelectorAll('.suggest').forEach(s =>
      s.onclick = () => addTopic(s.dataset.t));
  }

  /* ── COMPOSER: MENTIONS ── */
  function renderMentionChips() {
    $('#mentionChips').innerHTML = selectedMentions.map((p, i) =>
      `<span class="chip mention">@${esc(p.name)} <span class="x" data-i="${i}">✕</span></span>`).join('');
    $('#mentionChips').querySelectorAll('.x').forEach(x =>
      x.onclick = () => { selectedMentions.splice(+x.dataset.i, 1); renderMentionChips(); });
  }
  function populateMentionSelect() {
    const opts = (window.EMPLOYEES || [])
      .map(e => `<option value="${esc(e.full_name)}" data-email="${esc(e.email || '')}">${esc(e.full_name)}</option>`)
      .join('');
    $('#mention_select').innerHTML = '<option value="">Add a person…</option>' + opts;
  }

  /* ── FILTERS ── */
  function refreshFilterOptions() {
    const topics = [...new Set(ALL.flatMap(m => m.topics || []))].sort();
    $('#filter_topic').innerHTML = '<option value="">All topics</option>' +
      topics.map(t => `<option value="${esc(t)}">#${esc(t)}</option>`).join('');
    $('#filter_topic').value = state.topic;

    const authors = [...new Set(ALL.map(m => m.author_name))].sort();
    $('#filter_author').innerHTML = '<option value="">All authors</option>' +
      authors.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
    $('#filter_author').value = state.author;
  }

  function matches(m) {
    if (state.onlyQuestions && !m.is_question) return false;
    if (state.onlyOpen && !(m.is_question && !m.resolved)) return false;
    if (state.onlyMentions) {
      const hit = (m.mentions || []).some(x => (x.email || '').toLowerCase() === me());
      if (!hit) return false;
    }
    if (state.topic && !(m.topics || []).some(t => t.toLowerCase() === state.topic.toLowerCase())) return false;
    if (state.author && m.author_name !== state.author) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      const hay = [m.body, m.author_name, ...(m.topics || [])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  /* ── STATS ── */
  function updateStats() {
    const total = ALL.length;
    const openQ = ALL.filter(m => m.is_question && !m.resolved).length;
    const myMentions = ALL.filter(m => (m.mentions || []).some(x => (x.email || '').toLowerCase() === me())).length;
    $('#statRow').innerHTML =
      `<span class="stat-chip"><span class="num">${total}</span> notes</span>
       <span class="stat-chip"><span class="num">${openQ}</span> open questions</span>
       <span class="stat-chip ${myMentions ? 'alert' : ''}"><span class="num">${myMentions}</span> mentioning me</span>`;
  }

  /* ── RENDER ── */
  function msgHtml(m, isReply) {
    const mine = m.author_email && m.author_email.toLowerCase() === me();
    const mentionsMe = (m.mentions || []).some(x => (x.email || '').toLowerCase() === me());
    let badge = '';
    if (m.is_question) badge = m.resolved
      ? '<span class="q-badge resolved">Resolved</span>'
      : '<span class="q-badge">Question</span>';

    const topics = (m.topics || []).map(t =>
      `<span class="chip topic clickable-topic" data-topic="${esc(t)}">#${esc(t)}</span>`).join('');
    const mentions = (m.mentions || []).map(p =>
      `<span class="chip mention">@${esc(p.name)}</span>`).join('');

    const acts = [];
    if (!isReply) acts.push(`<button class="msg-act" data-act="reply" data-id="${m.id}">↩ Reply</button>`);
    if (m.is_question) acts.push(`<button class="msg-act" data-act="resolve" data-id="${m.id}">${m.resolved ? 'Reopen' : '✓ Resolve'}</button>`);
    if (mine) {
      acts.push(`<button class="msg-act" data-act="edit" data-id="${m.id}">Edit</button>`);
      acts.push(`<button class="msg-act danger" data-act="delete" data-id="${m.id}">Delete</button>`);
    }

    const body = editingId === m.id
      ? `<div class="inline-edit">
           <textarea id="edit_${m.id}">${esc(m.body)}</textarea>
           <div class="inline-edit-actions">
             <button class="submit-btn" data-act="save" data-id="${m.id}">Save</button>
             <button class="btn-secondary" data-act="canceledit" data-id="${m.id}">Cancel</button>
           </div>
         </div>`
      : `<div class="msg-body">${esc(m.body)}</div>`;

    return `<div class="msg ${isReply ? 'reply' : ''} ${mentionsMe ? 'mine-mention' : ''}">
      <div class="msg-head">
        <span class="msg-author">${esc(m.author_name)}</span>
        ${badge}
        <span class="msg-time">${fmtTime(m.created_at)}${m.edited_at ? ' · edited' : ''}</span>
      </div>
      ${body}
      ${(topics || mentions) ? `<div class="msg-meta">${topics}${mentions}</div>` : ''}
      ${acts.length ? `<div class="msg-actions">${acts.join('')}</div>` : ''}
    </div>`;
  }

  function render() {
    const tops = ALL.filter(m => !m.parent_id);
    const repliesOf = id => ALL.filter(m => m.parent_id === id).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    const visible = tops.filter(m => matches(m) || repliesOf(m.id).some(matches))
                        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    if (!visible.length) {
      $('#feed').innerHTML = `<div class="empty-state"><div class="big">💬</div>No notes match — start the conversation above.</div>`;
      return;
    }

    $('#feed').innerHTML = visible.map(m => {
      const reps = repliesOf(m.id);
      const repHtml = reps.length ? `<div class="replies">${reps.map(r => msgHtml(r, true)).join('')}</div>` : '';
      return `<div>${msgHtml(m, false)}${repHtml}</div>`;
    }).join('');

    wireFeed();
  }

  function wireFeed() {
    $('#feed').querySelectorAll('.clickable-topic').forEach(el =>
      el.onclick = () => {
        state.topic = el.dataset.topic;
        $('#filter_topic').value = state.topic;
        openFilters(true);
        render();
      });

    $('#feed').querySelectorAll('[data-act]').forEach(btn => {
      const id = btn.dataset.id, act = btn.dataset.act;
      btn.onclick = () => {
        if (act === 'reply') startReply(id);
        else if (act === 'resolve') toggleResolve(id);
        else if (act === 'edit') { editingId = id; render(); }
        else if (act === 'canceledit') { editingId = null; render(); }
        else if (act === 'save') saveEdit(id);
        else if (act === 'delete') deleteMsg(id);
      };
    });
  }

  /* ── ACTIONS ── */
  function startReply(id) {
    const m = ALL.find(x => x.id === id);
    if (!m) return;
    replyTo = { id, author: m.author_name };
    $('#replyContextText').textContent = 'Replying to ' + m.author_name;
    $('#replyContext').classList.add('show');
    if ($('#is_question')) $('#is_question').checked = false;
    $('#msg_body').focus();
    document.querySelector('.composer').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function cancelReply() { replyTo = null; $('#replyContext').classList.remove('show'); }

  async function toggleResolve(id) {
    const m = ALL.find(x => x.id === id);
    if (!m) return;
    const { error } = await window.sb.from('tyrecycle_chat_messages').update({ resolved: !m.resolved }).eq('id', id);
    if (error) return BromarHub.showInfo('Could not update: ' + error.message);
    await loadMessages();
  }

  async function saveEdit(id) {
    const val = ($('#edit_' + id)?.value || '').trim();
    if (!val) return BromarHub.showInfo('Note cannot be empty');
    const { error } = await window.sb.from('tyrecycle_chat_messages')
      .update({ body: val, edited_at: new Date().toISOString() }).eq('id', id);
    if (error) return BromarHub.showInfo('Could not save: ' + error.message);
    editingId = null;
    await loadMessages();
    BromarHub.showSuccess('Note updated');
  }

  async function deleteMsg(id) {
    if (!confirm('Delete this note? Any replies to it will also be removed.')) return;
    await window.sb.from('tyrecycle_chat_messages').delete().eq('parent_id', id);
    const { error } = await window.sb.from('tyrecycle_chat_messages').delete().eq('id', id);
    if (error) return BromarHub.showInfo('Could not delete: ' + error.message);
    await loadMessages();
    BromarHub.showSuccess('Note deleted');
  }

  function ensureUser() {
    if (window.currentUser) return;
    const sel = $('#post_as');
    if (sel && sel.value) {
      const opt = sel.selectedOptions[0];
      window.currentUser = { name: opt.value, email: opt.dataset.email || '' };
    }
  }

  async function postMessage() {
    const body = $('#msg_body').value.trim();
    if (!body) return BromarHub.showInfo('Write a note first');
    ensureUser();
    if (!window.currentUser) return BromarHub.showInfo('Select who you are posting as');

    BromarHub.showLoading('Posting note…');
    const row = {
      author_name: window.currentUser.name,
      author_email: window.currentUser.email || '',
      body,
      topics: selectedTopics,
      mentions: selectedMentions,
      is_question: !!$('#is_question').checked,
      resolved: false,
      parent_id: replyTo ? replyTo.id : null
    };

    const { data, error } = await window.sb.from('tyrecycle_chat_messages').insert(row).select().single();
    if (error) { BromarHub.hideLoading(); return BromarHub.showInfo('Could not post: ' + error.message); }

    if (selectedMentions.length) {
      const mrows = selectedMentions.map(p => ({
        message_id: data.id,
        mentioned_name: p.name,
        mentioned_email: p.email || '',
        author_name: window.currentUser.name
      }));
      await window.sb.from('tyrecycle_chat_mentions').insert(mrows);
      notifyByEmail(data, selectedMentions);
    }

    resetComposer();
    BromarHub.hideLoading();
    BromarHub.showSuccess('Note posted');
    await loadMessages();
  }

  function resetComposer() {
    $('#msg_body').value = '';
    $('#is_question').checked = false;
    selectedTopics = []; selectedMentions = [];
    renderTopicChips(); renderMentionChips();
    cancelReply();
  }

  function notifyByEmail(msg, mentions) {
    try {
      fetch(NOTIFY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mentions,
          author: window.currentUser?.name || '',
          snippet: (msg.body || '').slice(0, 240),
          isQuestion: !!msg.is_question,
          url: window.location.href
        })
      }).catch(() => {});
    } catch (_) { /* non-blocking */ }
  }

  /* ── MENTION BADGE ── */
  async function checkMentions() {
    if (!me()) { $('#mentionBanner').classList.remove('show'); return; }
    const { data, error } = await window.sb.from('tyrecycle_chat_mentions')
      .select('id').ilike('mentioned_email', me()).is('seen_at', null);
    if (error) return;
    const n = (data || []).length;
    if (n > 0) {
      $('#mentionBannerText').textContent = `You have ${n} unread mention${n > 1 ? 's' : ''}`;
      $('#mentionBanner').classList.add('show');
    } else {
      $('#mentionBanner').classList.remove('show');
    }
  }

  async function markMentionsSeen() {
    if (!me()) return;
    await window.sb.from('tyrecycle_chat_mentions')
      .update({ seen_at: new Date().toISOString() })
      .ilike('mentioned_email', me()).is('seen_at', null);
    $('#mentionBanner').classList.remove('show');
  }

  /* ── LOAD ── */
  async function loadMessages() {
    const { data, error } = await window.sb.from('tyrecycle_chat_messages')
      .select('*').order('created_at', { ascending: true });
    if (error) { BromarHub.showInfo('Could not load chat: ' + error.message); return; }
    ALL = data || [];
    updateStats();
    refreshFilterOptions();
    renderTopicSuggestions();
    render();
    checkMentions();
  }

  /* ── FILTER UI ── */
  function openFilters(open) {
    $('#filterPanel').classList.toggle('show', open);
    $('#filterToggle').classList.toggle('open', open);
  }

  /* ── INIT ── */
  async function init() {
    // Composer author
    await BromarHub.loadEmployees('post_as');
    await BromarHub.autoSelectLoggedInUser('post_as');
    const sel = $('#post_as');
    if (sel.value) {
      const opt = sel.selectedOptions[0];
      window.currentUser = { name: opt.value, email: opt.dataset.email || '' };
    }
    sel.addEventListener('change', function () {
      const opt = this.selectedOptions[0];
      window.currentUser = opt?.value ? { name: opt.value, email: opt.dataset.email || '' } : null;
    });

    populateMentionSelect();

    // Topics
    $('#topic_input').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTopic($('#topic_input').value); }
    });

    // Mentions
    $('#mention_select').addEventListener('change', function () {
      const opt = this.selectedOptions[0];
      if (opt?.value && !selectedMentions.some(p => p.name === opt.value)) {
        selectedMentions.push({ name: opt.value, email: opt.dataset.email || '' });
        renderMentionChips();
      }
      this.value = '';
    });

    // Compose / reply
    $('#postBtn').onclick = postMessage;
    $('#replyCancel').onclick = cancelReply;

    // Filters
    $('#filterToggle').onclick = () => openFilters(!$('#filterPanel').classList.contains('show'));
    $('#search_text').addEventListener('input', e => { state.search = e.target.value; render(); });
    $('#filter_topic').addEventListener('change', e => { state.topic = e.target.value; render(); });
    $('#filter_author').addEventListener('change', e => { state.author = e.target.value; render(); });
    $('#only_questions').addEventListener('change', e => { state.onlyQuestions = e.target.checked; render(); });
    $('#only_open').addEventListener('change', e => { state.onlyOpen = e.target.checked; render(); });
    $('#only_mentions').addEventListener('change', e => { state.onlyMentions = e.target.checked; render(); });
    $('#clearFilters').onclick = () => {
      Object.assign(state, { search: '', topic: '', author: '', onlyQuestions: false, onlyOpen: false, onlyMentions: false });
      $('#search_text').value = ''; $('#filter_topic').value = ''; $('#filter_author').value = '';
      $('#only_questions').checked = $('#only_open').checked = $('#only_mentions').checked = false;
      render();
    };

    // Mention banner
    $('#viewMentionsBtn').onclick = async () => {
      state.onlyMentions = true; $('#only_mentions').checked = true;
      openFilters(true); render();
      await markMentionsSeen();
    };
    $('#dismissMentionsBtn').onclick = markMentionsSeen;

    await loadMessages();

    // Realtime live feed (falls back gracefully if realtime not enabled)
    try {
      window.sb.channel('tyrecycle-chat')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tyrecycle_chat_messages' }, () => loadMessages())
        .subscribe();
    } catch (_) { /* ignore */ }
  }

  // auth.js + bromar-hub.js run first; wait for DOM + shared init
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(init, 0));
  } else {
    setTimeout(init, 0);
  }
})();
</script>
</body>
</html>
