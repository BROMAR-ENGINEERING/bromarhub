  <style>
    /* ── PAGE-SPECIFIC ── */
    .page-wrapper { margin-top: 90px; }
    @media (max-width: 520px) { .page-wrapper { margin-top: 80px; } }

    /* Area tabs */
    .area-tabs { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; }
    .area-tab {
      flex: 1; padding: 0.875rem 1rem; border: 2px solid var(--border);
      border-radius: 10px; background: var(--bg-secondary); cursor: pointer;
      font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 0.9rem;
      color: var(--text-primary); transition: all 0.2s; text-align: center;
    }
    .area-tab .count { display: block; font-size: 0.72rem; font-weight: 500; color: var(--text-secondary); margin-top: 2px; }
    .area-tab.active { border-color: var(--accent); background: var(--card-hover); color: var(--accent); }
    .area-tab.active .count { color: var(--accent); }

    /* Toolbar */
    .el-toolbar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .el-toolbar input[type="text"] { flex: 1; min-width: 180px; }
    .quick-btn {
      padding: 0.6rem 1rem; border: 1px solid var(--border); border-radius: 9px;
      background: transparent; color: var(--text-secondary); cursor: pointer;
      font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 0.8rem; transition: all 0.2s; white-space: nowrap;
    }
    .quick-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--card-hover); }

    /* Sticky stats */
    .stats-bar {
      position: sticky; top: 66px; z-index: 50;
      display: flex; gap: 0.5rem; margin-bottom: 1.25rem;
      background: var(--bg-glass); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 12px; padding: 0.6rem 0.75rem;
    }
    .stat { flex: 1; text-align: center; }
    .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 600; }
    .stat-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); }
    .stat.pass .stat-num { color: var(--success); }
    .stat.fail .stat-num { color: var(--error); }

    /* Fitting card */
    .fitting { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 0.7rem; transition: border-color 0.2s; }
    .fitting.is-pass { border-color: var(--success-border); }
    .fitting.is-fail { border-color: var(--error-border); }
    .fitting-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; flex-wrap: wrap; }
    .fitting-id { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .fitting-ref { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 0.95rem; color: var(--accent); }
    .fitting-loc { font-size: 0.92rem; font-weight: 600; color: var(--text-primary); }
    .fitting-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 0.5rem; }
    .tag { padding: 2px 9px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; font-size: 0.68rem; color: var(--text-secondary); font-weight: 600; }
    .tag.type { background: var(--card-hover); border-color: var(--accent); color: var(--accent); }
    .tag.na { background: var(--error-bg); border-color: var(--error-border); color: var(--error); }

    .pf-toggle { display: flex; gap: 0.5rem; }
    .pf-btn { padding: 0.55rem 1.15rem; border: 2px solid var(--border); border-radius: 9px; background: var(--bg-main); cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.82rem; color: var(--text-secondary); transition: all 0.15s; }
    .pf-btn.pass.sel { border-color: var(--success); background: var(--success-bg); color: var(--success); }
    .pf-btn.fail.sel { border-color: var(--error); background: var(--error-bg); color: var(--error); }

    .fail-extra { display: none; margin-top: 0.85rem; gap: 0.75rem; grid-template-columns: 160px 1fr; }
    .fitting.is-fail .fail-extra { display: grid; }
    .fitting-notes { margin-top: 0.75rem; }
    .fitting-notes textarea { min-height: 44px; font-size: 0.9rem; }
    @media (max-width: 560px) {
      .fail-extra { grid-template-columns: 1fr; }
      .fitting-head { flex-direction: column; }
      .pf-toggle { width: 100%; }
      .pf-btn { flex: 1; }
    }

    /* In-card footer */
    .card-footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center; }
    .card-footer-title { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.8px; color: var(--text-primary); margin-bottom: 10px; }
    @media (max-width: 420px) { .card-footer-title { font-size: 0.85rem; } }
    .card-footer-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 14px; }
    .card-footer-link:hover { text-decoration: underline; }
    .card-footer-version { font-size: 0.78rem; color: var(--text-secondary); font-weight: 500; }
  </style>
</head>

        !q || f.ref.toLowerCase().includes(q) || f.loc.toLowerCase().includes(q));
      const html = list.map(f => {
        const r = results[f.ref] || {};
        const cls = r.status === 'pass' ? 'is-pass' : r.status === 'fail' ? 'is-fail' : '';
        const tags = [];
        if (f.db) tags.push(`<span class="tag">${esc(f.db)}</span>`);
        if (f.ckt) tags.push(`<span class="tag">Ckt ${esc(f.ckt)}</span>`);
        if (f.m) tags.push(`<span class="tag">${esc(f.m)}</span>`);
        if (f.brand) tags.push(`<span class="tag">${esc(f.brand)} ${esc(f.model)}</span>`);
        if (f.na) tags.push(`<span class="tag na">${esc(f.na)}</span>`);
        return `
        <div class="fitting ${cls}" data-ref="${esc(f.ref)}">
          <div class="fitting-head">
            <div>
              <div class="fitting-id">
                <span class="fitting-ref">${esc(f.ref)}</span>
                ${f.type ? `<span class="tag type">${esc(f.type)}</span>` : ''}
              </div>
              <div class="fitting-loc">${esc(f.loc)}</div>
              <div class="fitting-tags">${tags.join('')}</div>
            </div>
            <div class="pf-toggle">
              <button type="button" class="pf-btn pass ${r.status==='pass'?'sel':''}" data-act="pass">PASS</button>
              <button type="button" class="pf-btn fail ${r.status==='fail'?'sel':''}" data-act="fail">FAIL</button>
            </div>
          </div>
          <div class="fail-extra">
            <div><label>Duration to failure (min)</label>
              <input type="number" min="0" step="1" class="f-duration" placeholder="e.g. 45" value="${esc(r.duration)}"/></div>
            <div><label>Fault notes</label>
              <input type="text" class="f-faultnote" placeholder="e.g. battery not holding charge" value="${esc(r.faultnote)}"/></div>
          </div>
          <div class="fitting-notes">
            <label>Notes</label>
            <textarea class="f-notes" placeholder="Optional notes...">${esc(r.notes)}</textarea>
          </div>
        </div>`;
      }).join('');
      document.getElementById('fittingList').innerHTML = html || '<p style="color:var(--text-secondary);text-align:center;padding:1rem;">No matches.</p>';
      updateStats();
    }

    function updateStats() {
      let pass = 0, fail = 0;
      Object.values(results).forEach(r => { if (r.status === 'pass') pass++; else if (r.status === 'fail') fail++; });
      const total = FITTINGS.factory.length + FITTINGS.office.length;
      document.getElementById('s-total').textContent = total;
      document.getElementById('s-pass').textContent = pass;
      document.getElementById('s-fail').textContent = fail;
      document.getElementById('s-rem').textContent = total - pass - fail;
      const cf = FITTINGS.factory.filter(f => results[f.ref]?.status).length;
      const co = FITTINGS.office.filter(f => results[f.ref]?.status).length;
      document.getElementById('cnt-factory').textContent = `${cf}/${FITTINGS.factory.length} done`;
      document.getElementById('cnt-office').textContent = `${co}/${FITTINGS.office.length} done`;
    }

    function set(ref, patch) { results[ref] = Object.assign({status:'',duration:'',faultnote:'',notes:''}, results[ref], patch); }

    document.getElementById('fittingList').addEventListener('click', e => {
      const btn = e.target.closest('.pf-btn');
      if (!btn) return;
      const card = btn.closest('.fitting');
      const ref = card.dataset.ref;
      const act = btn.dataset.act;
      const cur = results[ref]?.status;
      set(ref, { status: cur === act ? '' : act });
      renderList();
    });

    document.getElementById('fittingList').addEventListener('input', e => {
      const card = e.target.closest('.fitting'); if (!card) return;
      const ref = card.dataset.ref;
      if (e.target.classList.contains('f-duration')) set(ref, { duration: e.target.value });
      else if (e.target.classList.contains('f-faultnote')) set(ref, { faultnote: e.target.value });
      else if (e.target.classList.contains('f-notes')) set(ref, { notes: e.target.value });
    });

    document.querySelectorAll('.area-tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.area-tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      activeArea = t.dataset.area;
      renderList();
    }));

    document.getElementById('filter').addEventListener('input', renderList);

    document.getElementById('allPass').addEventListener('click', () => {
      FITTINGS[activeArea].forEach(f => { if (!f.na && f.type) set(f.ref, { status: 'pass' }); });
      renderList();
    });
    document.getElementById('clearArea').addEventListener('click', () => {
      FITTINGS[activeArea].forEach(f => { delete results[f.ref]; });
      renderList();
    });

    document.getElementById('submitBtn').addEventListener('click', submitLog);

    async function submitLog() {
      if (!currentUser) {
        const sel = document.getElementById('filled_by');
        if (sel.value) { const o = sel.selectedOptions[0]; currentUser = { name: o.value, email: o.dataset.email || '' }; }
      }
      const site = document.getElementById('site').value.trim();
      const testDate = document.getElementById('test_date').value;
      const startTime = document.getElementById('start_time').value;
      if (!site) return BromarHub.showInfo('Enter the site / location');
      if (!testDate) return BromarHub.showInfo('Select the test date');
      if (!startTime) return BromarHub.showInfo('Enter the discharge start time');
      if (!currentUser) return BromarHub.showInfo('Select who tested');

      const rows = [];
      ['factory','office'].forEach(area => FITTINGS[area].forEach(f => {
        const r = results[f.ref];
        if (r && r.status) rows.push({
          ref: f.ref, area, location: f.loc, type: f.type, db: f.db, circuit: f.ckt,
          maintained: f.m, brand: f.brand, model: f.model,
          result: r.status, duration_min: r.status === 'fail' ? (r.duration || '') : '',
          fault_note: r.faultnote || '', notes: r.notes || ''
        });
      }));
      if (!rows.length) return BromarHub.showInfo('Mark at least one fitting pass or fail');

      const passed = rows.filter(r => r.result === 'pass').length;
      const failed = rows.filter(r => r.result === 'fail').length;

      BromarHub.showLoading('Saving test log...', `${rows.length} fittings`);
      try {
        const { error } = await window.sb.from('emergency_lighting_tests').insert([{
          test_date: testDate, site, job_number: document.getElementById('job_number').value.trim() || null,
          tester: currentUser.name, start_time: startTime,
          total: rows.length, passed, failed, results: rows
        }]);
        BromarHub.hideLoading();
        if (error) { console.error(error); return BromarHub.showInfo('Save failed: ' + error.message); }
        BromarHub.showSuccess(`Test log saved — ${passed} pass, ${failed} fail.`);
      } catch (err) { BromarHub.hideLoading(); console.error(err); BromarHub.showInfo('Save failed. Check console.'); }
    }

    // Injected header hardcodes ../ paths; correct them to absolute for this deep folder
    (function fixHeaderPaths(tries) {
      const h = document.querySelector('.header');
      if (!h) { if (tries < 40) return setTimeout(() => fixHeaderPaths(tries + 1), 25); return; }
      const home = h.querySelector('a[aria-label="Home"]');
      if (home) home.setAttribute('href', '/index.html');
      const light = h.querySelector('.light-logo');
      const dark = h.querySelector('.dark-logo');
      if (light) light.src = '/Bromar-Primary-Logo-Full-Colour.png';
      if (dark) dark.src = '/Bromar-Primary-Logo-Reverse-White.png';
    })(0);

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('test_date').value = new Date().toISOString().slice(0, 10);
      const now = new Date();
      document.getElementById('start_time').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      renderList();
      EMPLOYEES = await BromarHub.loadEmployees('filled_by');
      await BromarHub.autoSelectLoggedInUser('filled_by');
      const fb = document.getElementById('filled_by');
      if (fb.value) { const o = fb.selectedOptions[0]; currentUser = { name: o.value, email: o.dataset.email || '' }; }
      fb.addEventListener('change', function () {
        const o = this.selectedOptions[0];
        currentUser = o?.value ? { name: o.value, email: o.dataset.email || '' } : null;
      });
    });
  </script>
</body>
</html>
