<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Directory — Bromar Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/tools/auth.js"></script>
  <link rel="stylesheet" href="/tools/bromar-hub.css"/>
  <script src="/tools/bromar-hub.js" defer></script>

  <style>
    .page-wrapper { margin-top: 90px; }
    @media (max-width: 520px) { .page-wrapper { margin-top: 80px; } }

    .toolbar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .contacts-search { position: relative; flex: 1; min-width: 200px; }
    .contacts-search input { padding-left: 2.75rem; }
    .contacts-search svg {
      position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; stroke: var(--text-secondary);
      stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none;
    }
    .add-contact-btn {
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 600;
      padding: 0.75rem 1.25rem; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      color: #fff; cursor: pointer; transition: all 0.3s ease;
    }
    .add-contact-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3); }
    .add-contact-btn svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.5; fill: none; stroke-linecap: round; }

    .contact-group-label {
      display: flex; align-items: center; gap: 0.75rem;
      font-size: 1.05rem; font-weight: 600; color: var(--text-primary); margin: 2rem 0 1rem;
    }
    .contact-group-label:first-of-type { margin-top: 0; }
    .contact-group-label::before {
      content: ''; width: 4px; height: 18px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-light) 100%); border-radius: 4px;
    }

    .contact-card {
      display: flex; align-items: flex-start; gap: 1rem;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.1rem 1.25rem; margin-bottom: 0.75rem; transition: all 0.25s ease;
    }
    .contact-card:hover { border-color: var(--accent); box-shadow: 0 4px 14px var(--shadow); }

    .priority-badge {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 0.95rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); color: #fff; margin-top: 2px;
    }
    .priority-badge.muted { background: var(--bg-main); color: var(--text-secondary); border: 1px solid var(--border); }

    .contact-body { flex: 1; min-width: 0; }
    .contact-name { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
    .contact-role { font-size: 0.85rem; color: var(--text-secondary); margin-top: 1px; }
    .contact-meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; margin-top: 0.65rem; }
    .contact-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 500; color: var(--text-primary); text-decoration: none; transition: color 0.2s; }
    .contact-link:hover { color: var(--accent); }
    .contact-link svg { width: 15px; height: 15px; stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .shift-chip {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.3px;
      background: var(--card-hover); border: 1px solid var(--border); color: var(--accent); margin-top: 0.65rem;
    }

    .card-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .icon-btn {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-main); cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn.danger:hover { border-color: var(--error); color: var(--error); background: var(--error-bg); }
    .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .empty-state, .no-results { text-align: center; color: var(--text-secondary); padding: 3rem 1rem; font-size: 0.95rem; }
    .no-results { display: none; }
    .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

    /* Modal */
    .cd-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9000; align-items: center; justify-content: center; padding: 1rem; }
    .cd-modal.show { display: flex; }
    .cd-modal-content { background: var(--bg-secondary); border-radius: 16px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2rem; }
    .cd-modal-content h2 { font-size: 1.35rem; font-weight: 600; margin-bottom: 1.5rem; }

    .card-footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center; }
    .card-footer-title { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.8px; color: var(--text-primary); margin-bottom: 10px; white-space: nowrap; }
    @media (max-width: 420px) { .card-footer-title { font-size: 0.85rem; letter-spacing: 0.5px; } }
    .card-footer-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 14px; }
    .card-footer-link:hover { text-decoration: underline; }
    .card-footer-version { font-size: 0.78rem; color: var(--text-secondary); font-weight: 500; }
  </style>
</head>
<body>

  <div id="bromar-header"></div>

  <div class="page-title-wrapper">
    <h1>Contact Directory</h1>
    <p class="subtitle">Tyrecycle — Somerton · contact in priority order</p>
  </div>

  <div class="page-wrapper">
    <div class="form-card">

      <div class="success-banner" id="successBanner">
        <span id="successText"></span>
      </div>
      <div class="info-banner" id="infoBanner">
        <span id="infoBannerText"></span>
      </div>

      <div class="toolbar">
        <div class="contacts-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="contactSearch" placeholder="Search name, role or number..." autocomplete="off"/>
        </div>
        <button class="add-contact-btn" id="addContactBtn">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Contact
        </button>
      </div>

      <div id="contactsContainer"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">📇</div>
        No contacts yet. Click <strong>Add Contact</strong> to get started.
      </div>
      <div class="no-results" id="noResults">No contacts match your search.</div>

      <div class="card-footer">
        <div class="card-footer-title">BROMAR HUB — CONTACT DIRECTORY</div>
        <a class="card-footer-link" href="https://bromarhub.netlify.app/employee-resources/suggestions-feedback" target="_blank" rel="noopener">🐞 Report a bug or suggest an improvement</a>
        <div class="card-footer-version">Version V1.00</div>
      </div>

    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div class="cd-modal" id="contactModal">
    <div class="cd-modal-content">
      <h2 id="modalTitle">Add Contact</h2>
      <input type="hidden" id="contactId"/>

      <div class="field-group">
        <label for="f_name">Name <span class="required">*</span></label>
        <input type="text" id="f_name" placeholder="e.g. John Smith"/>
      </div>
      <div class="field-group">
        <label for="f_role">Role</label>
        <input type="text" id="f_role" placeholder="e.g. Site Supervisor"/>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label for="f_phone">Phone</label>
          <input type="tel" id="f_phone" placeholder="0400 000 000"/>
        </div>
        <div class="field-group">
          <label for="f_shift">Shift</label>
          <input type="text" id="f_shift" placeholder="Day / Afternoon / Night"/>
        </div>
      </div>
      <div class="field-group">
        <label for="f_email">Email</label>
        <input type="email" id="f_email" placeholder="name@company.com.au"/>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label for="f_group">Group</label>
          <input type="text" id="f_group" placeholder="e.g. Site Operations" list="groupList"/>
          <datalist id="groupList"></datalist>
        </div>
        <div class="field-group">
          <label for="f_priority">Priority order</label>
          <input type="number" id="f_priority" min="1" placeholder="1 = call first"/>
        </div>
      </div>

      <div class="submit-row" style="margin-top:1rem;">
        <button class="btn-secondary" id="cancelBtn">Cancel</button>
        <button class="submit-btn" id="saveBtn">Save Contact</button>
      </div>
    </div>
  </div>

  <script>
    const esc = (window.BromarHub?.escapeHtml) || (s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
    let CONTACTS = [];

    function phoneIcon() { return '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'; }
    function mailIcon() { return '<svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>'; }
    function editIcon() { return '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'; }
    function trashIcon() { return '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'; }

    function contactCard(p) {
      const telHref = p.phone ? p.phone.replace(/\s+/g, '') : '';
      const badge = (p.priority != null) ? `<div class="priority-badge">${p.priority}</div>` : `<div class="priority-badge muted">•</div>`;
      let meta = '';
      if (p.phone) meta += `<a class="contact-link" href="tel:${esc(telHref)}">${phoneIcon()}${esc(p.phone)}</a>`;
      if (p.email) meta += `<a class="contact-link" href="mailto:${esc(p.email)}">${mailIcon()}${esc(p.email)}</a>`;
      const shift = p.shift ? `<div><span class="shift-chip">${esc(p.shift)}</span></div>` : '';
      const searchStr = (p.name + ' ' + (p.role||'') + ' ' + (p.phone||'') + ' ' + (p.email||'') + ' ' + (p.shift||'')).toLowerCase();

      return `
        <div class="contact-card" data-search="${esc(searchStr)}">
          ${badge}
          <div class="contact-body">
            <div class="contact-name">${esc(p.name)}</div>
            ${p.role ? `<div class="contact-role">${esc(p.role)}</div>` : ''}
            <div class="contact-meta">${meta}</div>
            ${shift}
          </div>
          <div class="card-actions">
            <button class="icon-btn" title="Edit" onclick="openEdit('${p.id}')">${editIcon()}</button>
            <button class="icon-btn danger" title="Delete" onclick="deleteContact('${p.id}')">${trashIcon()}</button>
          </div>
        </div>`;
    }

    function render() {
      const container = document.getElementById('contactsContainer');
      const empty = document.getElementById('emptyState');

      if (!CONTACTS.length) { container.innerHTML = ''; empty.style.display = 'block'; return; }
      empty.style.display = 'none';

      const groups = {};
      CONTACTS.forEach(c => { const g = c.contact_group || 'General'; (groups[g] = groups[g] || []).push(c); });

      container.innerHTML = Object.keys(groups).sort().map(g => {
        const sorted = [...groups[g]].sort((a, b) => {
          if (a.priority == null && b.priority == null) return a.name.localeCompare(b.name);
          if (a.priority == null) return 1;
          if (b.priority == null) return -1;
          return a.priority - b.priority;
        });
        return `<div class="contact-group-label">${esc(g)}</div>` + sorted.map(contactCard).join('');
      }).join('');

      // Populate group datalist
      document.getElementById('groupList').innerHTML =
        [...new Set(CONTACTS.map(c => c.contact_group).filter(Boolean))].map(g => `<option value="${esc(g)}">`).join('');
    }

    async function loadContacts() {
      if (!window.sb) return;
      const { data, error } = await window.sb.from('tyrecycle_contacts').select('*');
      if (error) { console.error(error); BromarHub.showInfo('Could not load contacts'); return; }
      CONTACTS = data || [];
      render();
    }

    // ── Modal ──
    const modal = document.getElementById('contactModal');
    function openModal(title) { document.getElementById('modalTitle').textContent = title; modal.classList.add('show'); }
    function closeModal() { modal.classList.remove('show'); }
    function clearForm() {
      ['contactId','f_name','f_role','f_phone','f_shift','f_email','f_group','f_priority'].forEach(id => document.getElementById(id).value = '');
    }

    function openAdd() { clearForm(); openModal('Add Contact'); document.getElementById('f_name').focus(); }

    window.openEdit = function (id) {
      const c = CONTACTS.find(x => x.id === id); if (!c) return;
      document.getElementById('contactId').value = c.id;
      document.getElementById('f_name').value = c.name || '';
      document.getElementById('f_role').value = c.role || '';
      document.getElementById('f_phone').value = c.phone || '';
      document.getElementById('f_shift').value = c.shift || '';
      document.getElementById('f_email').value = c.email || '';
      document.getElementById('f_group').value = c.contact_group || '';
      document.getElementById('f_priority').value = c.priority ?? '';
      openModal('Edit Contact');
    };

    async function saveContact() {
      const name = document.getElementById('f_name').value.trim();
      if (!name) { BromarHub.showInfo('Name is required'); return; }

      const priorityRaw = document.getElementById('f_priority').value.trim();
      const record = {
        name,
        role:  document.getElementById('f_role').value.trim()  || null,
        phone: document.getElementById('f_phone').value.trim() || null,
        email: document.getElementById('f_email').value.trim() || null,
        shift: document.getElementById('f_shift').value.trim() || null,
        contact_group: document.getElementById('f_group').value.trim() || 'General',
        priority: priorityRaw === '' ? null : parseInt(priorityRaw, 10),
      };
      const id = document.getElementById('contactId').value;

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;

      let error;
      if (id) {
        ({ error } = await window.sb.from('tyrecycle_contacts').update(record).eq('id', id));
      } else {
        ({ error } = await window.sb.from('tyrecycle_contacts').insert([record]));
      }
      saveBtn.disabled = false;

      if (error) { console.error(error); BromarHub.showInfo('Save failed'); return; }
      closeModal();
      BromarHub.showSuccess(id ? 'Contact updated' : 'Contact added');
      await loadContacts();
    }

    window.deleteContact = async function (id) {
      const c = CONTACTS.find(x => x.id === id);
      if (!confirm(`Delete ${c ? c.name : 'this contact'}?`)) return;
      const { error } = await window.sb.from('tyrecycle_contacts').delete().eq('id', id);
      if (error) { console.error(error); BromarHub.showInfo('Delete failed'); return; }
      BromarHub.showSuccess('Contact deleted');
      await loadContacts();
    };

    function initSearch() {
      const input = document.getElementById('contactSearch');
      const noResults = document.getElementById('noResults');
      input.addEventListener('input', function () {
        const q = this.value.trim().toLowerCase();
        const cards = document.querySelectorAll('.contact-card');
        const labels = document.querySelectorAll('.contact-group-label');
        let anyVisible = false;
        cards.forEach(c => { const m = !q || c.dataset.search.includes(q); c.style.display = m ? 'flex' : 'none'; if (m) anyVisible = true; });
        labels.forEach(lbl => {
          let sib = lbl.nextElementSibling, visible = false;
          while (sib && sib.classList.contains('contact-card')) { if (sib.style.display !== 'none') visible = true; sib = sib.nextElementSibling; }
          lbl.style.display = visible ? 'flex' : 'none';
        });
        if (CONTACTS.length) noResults.style.display = anyVisible ? 'none' : 'block';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('addContactBtn').addEventListener('click', openAdd);
      document.getElementById('cancelBtn').addEventListener('click', closeModal);
      document.getElementById('saveBtn').addEventListener('click', saveContact);
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      initSearch();
      loadContacts();
    });
  </script>

</body>
</html>
