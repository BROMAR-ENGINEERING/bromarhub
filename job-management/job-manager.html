<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Job Manager — Bromar Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/tools/auth.js"></script>
<link rel="stylesheet" href="../tools/bromar-hub.css"/>
<script src="../tools/bromar-hub.js" defer></script>

<style>
  .page-wrapper {
    margin-top: 80px;
    max-width: 1400px;
    padding: 0 1.5rem 2rem;
  }
  .page-wrapper.has-sidebar {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 1.5rem;
    align-items: start;
  }

  .header-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem 2rem;
    margin-bottom: 1.25rem;
    text-align: center;
  }
  .header-title { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.25rem; }
  .header-subtitle { color: var(--text-secondary); font-size: 0.95rem; font-weight: 300; }

  .search-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .search-label {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--text-secondary);
    margin-bottom: 0.625rem;
  }
  .search-input {
    width: 100%;
    padding: 0.85rem 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(234,88,12,0.1); }

  .filter-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.875rem;
    align-items: center;
  }
  .filter-divider { width: 1px; align-self: stretch; background: var(--border); margin: 0 0.25rem; }
  .filter-chip {
    padding: 0.45rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-main);
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.active { background: var(--card-hover); border-color: var(--accent); color: var(--accent); }

  .job-list { display: grid; gap: 0.625rem; margin-top: 1.125rem; }
  .job-row {
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.875rem 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.875rem;
    align-items: center;
  }
  .job-row:hover { border-color: var(--accent); transform: translateX(2px); background: var(--card-hover); }
  .job-num { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 700; color: var(--accent); min-width: 78px; }
  .job-info { min-width: 0; }
  .job-client { font-size: 0.95rem; font-weight: 600; margin-bottom: 1px; }
  .job-desc { font-size: 0.78rem; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-status {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 3px 8px; border-radius: 10px;
  }
  .status-active   { background: var(--success-bg); color: var(--success); }
  .status-pending  { background: #fef3c7; color: #92400e; }
  .status-complete { background: var(--info-bg); color: var(--info-text); }
  [data-theme="dark"] .status-pending { background: rgba(245,158,11,0.15); color: #fbbf24; }

  .empty-state { text-align: center; padding: 2rem 1rem; color: var(--text-secondary); }
  .empty-state-icon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.4; }
  .empty-state-text { font-size: 0.9rem; }

  /* sidebar */
  .sidebar {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    position: sticky;
    top: 80px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }
  .sidebar-job {
    padding-bottom: 0.875rem;
    margin-bottom: 0.875rem;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-job-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; font-weight: 700; color: var(--accent);
    background: var(--card-hover);
    padding: 3px 8px; border-radius: 6px;
    display: inline-block;
    margin-bottom: 0.5rem;
  }
  .sidebar-job-client { font-size: 0.98rem; font-weight: 700; margin-bottom: 2px; line-height: 1.3; }
  .sidebar-job-desc { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.4; }
  .change-job-btn {
    margin-top: 0.625rem; width: 100%; padding: 0.5rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--text-secondary);
    font-family: 'Outfit', sans-serif; font-size: 0.78rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .change-job-btn:hover { border-color: var(--accent); color: var(--accent); }

  .sidebar-section-label {
    font-size: 0.68rem; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.7px;
    margin-bottom: 0.5rem; padding: 0 0.5rem;
  }
  .nav-item {
    display: flex; align-items: center; gap: 0.625rem;
    padding: 0.625rem 0.75rem; border-radius: 8px;
    color: var(--text-primary); font-size: 0.9rem; font-weight: 500;
    cursor: pointer; border: none; background: transparent;
    width: 100%; text-align: left;
    transition: all 0.2s; margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--card-hover); color: var(--accent); }
  .nav-item.active { background: var(--card-hover); color: var(--accent); font-weight: 600; }
  .nav-item .nav-icon { font-size: 1rem; width: 18px; text-align: center; }
  .nav-item .nav-count {
    margin-left: auto; font-size: 0.7rem;
    background: var(--bg-main); color: var(--text-secondary);
    padding: 1px 7px; border-radius: 10px;
    font-weight: 600; min-width: 22px; text-align: center;
  }
  .nav-item.active .nav-count { background: var(--accent); color: white; }

  .sidebar-toggle {
    display: none;
    background: var(--bg-secondary); border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 0.5rem 0.875rem; border-radius: 10px;
    cursor: pointer; align-items: center; gap: 0.5rem;
    font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 600;
    margin-bottom: 1rem;
  }
  .sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .sidebar-close {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 1.4rem; padding: 0; width: 28px; height: 28px;
    display: none; margin-left: auto;
  }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 90;
  }
  .sidebar-overlay.show { display: block; }

  .main-content { min-width: 0; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .stat-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.875rem 1.1rem;
  }
  .stat-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-secondary); font-weight: 700;
    margin-bottom: 0.25rem;
  }
  .stat-value { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
  .stat-value.accent { color: var(--accent); }

  .tool-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem 1.75rem;
  }
  .tool-card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.125rem; gap: 1rem; flex-wrap: wrap;
  }
  .tool-card-title { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
  .tool-card-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .btn-add {
    padding: 0.55rem 1rem; border: none; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
    color: white;
    font-family: 'Outfit', sans-serif;
    font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-add:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(234,88,12,0.3); }

  .data-table-wrapper { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; overflow-x: auto; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 500px; }
  .data-table th {
    background: var(--bg-main); text-align: left;
    padding: 0.7rem 0.875rem;
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-secondary); font-weight: 700;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .data-table td { padding: 0.7rem 0.875rem; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: var(--card-hover); }

  .doc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.75rem;
  }
  .doc-tile {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 0.875rem 1rem;
    cursor: pointer; transition: all 0.2s;
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .doc-tile:hover { border-color: var(--accent); background: var(--card-hover); }
  .doc-icon { font-size: 1.5rem; }
  .doc-name { font-weight: 600; font-size: 0.9rem; line-height: 1.3; }
  .doc-meta { font-size: 0.72rem; color: var(--text-secondary); }

  .card-footer {
    margin-top: 24px; padding: 20px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: center;
  }
  .card-footer-title {
    font-weight: 700; font-size: 1rem; letter-spacing: 0.6px;
    color: var(--text-primary); margin-bottom: 8px;
  }
  .card-footer-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.82rem; color: var(--accent); text-decoration: none;
    font-weight: 600; margin-bottom: 10px;
  }
  .card-footer-link:hover { text-decoration: underline; }
  .card-footer-version {
    font-size: 0.74rem; color: var(--text-secondary);
    font-weight: 500; font-family: 'JetBrains Mono', monospace;
  }

  @media (max-width: 900px) {
    .page-wrapper, .page-wrapper.has-sidebar {
      grid-template-columns: 1fr;
      padding: 0 1rem 2rem;
    }
    .sidebar-toggle { display: inline-flex; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 280px; max-height: 100vh; border-radius: 0;
      z-index: 95;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      padding-top: 1.5rem;
    }
    .sidebar.show { transform: translateX(0); }
    .sidebar-close { display: flex; align-items: center; justify-content: center; }
    .header-card { padding: 1.25rem; }
    .header-title { font-size: 1.4rem; }
    .tool-card { padding: 1.25rem; }
  }
</style>
</head>
<body>

<div id="bromar-header"></div>

<div class="page-wrapper" id="pageWrapper">

  <aside class="sidebar" id="sidebar" style="display:none;">
    <div class="sidebar-job">
      <div style="display:flex;align-items:flex-start;">
        <div style="flex:1;">
          <div class="sidebar-job-num" id="sbJobNum"></div>
          <div class="sidebar-job-client" id="sbJobClient"></div>
          <div class="sidebar-job-desc" id="sbJobDesc"></div>
        </div>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">&times;</button>
      </div>
      <button class="change-job-btn" id="changeJobBtn">&larr; Change Job</button>
    </div>

    <div class="sidebar-section-label">Tools</div>
    <button class="nav-item active" data-tool="overview"><span class="nav-icon">📊</span><span>Overview</span></button>
    <button class="nav-item" data-tool="labour"><span class="nav-icon">👷</span><span>Labour</span><span class="nav-count" id="cnt-labour">0</span></button>
    <button class="nav-item" data-tool="materials"><span class="nav-icon">📦</span><span>Materials</span><span class="nav-count" id="cnt-materials">0</span></button>
    <button class="nav-item" data-tool="pos"><span class="nav-icon">🧾</span><span>Purchase Orders</span><span class="nav-count" id="cnt-pos">0</span></button>
    <button class="nav-item" data-tool="notes"><span class="nav-icon">📝</span><span>Notes</span><span class="nav-count" id="cnt-notes">0</span></button>
    <button class="nav-item" data-tool="documents"><span class="nav-icon">📂</span><span>Documents</span><span class="nav-count" id="cnt-documents">0</span></button>
    <button class="nav-item" data-tool="safety"><span class="nav-icon">🦺</span><span>Safety</span><span class="nav-count" id="cnt-safety">0</span></button>
    <button class="nav-item" data-tool="testing"><span class="nav-icon">🧪</span><span>Testing</span><span class="nav-count" id="cnt-testing">0</span></button>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content">

    <button class="sidebar-toggle" id="sidebarToggle" style="display:none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span>Tools</span>
    </button>

    <div class="header-card">
      <h1 class="header-title">Job Manager</h1>
      <p class="header-subtitle" id="headerSubtitle">Search and select a job to view its records</p>
    </div>

    <div class="success-banner" id="successBanner"><span>✓</span><span id="successText"></span></div>
    <div class="info-banner" id="infoBanner"><span>ℹ</span><span id="infoBannerText"></span></div>

    <div id="searchView">
      <div class="search-card">
        <div class="search-label">Find a job</div>
        <input type="text" class="search-input" id="jobSearch" placeholder="Search by job number, client, or description..." autocomplete="off"/>

        <div class="filter-row">
          <button class="filter-chip active" data-status="all">All</button>
          <button class="filter-chip" data-status="active">Active</button>
          <button class="filter-chip" data-status="pending">Pending</button>
          <button class="filter-chip" data-status="complete">Completed</button>
          <span class="filter-divider"></span>
          <button class="filter-chip" data-prefix="BE">BE</button>
          <button class="filter-chip" data-prefix="BC">BC</button>
          <button class="filter-chip" data-prefix="BA">BA</button>
          <button class="filter-chip" data-prefix="BS">BS</button>
          <button class="filter-chip" data-prefix="BM">BM</button>
        </div>

        <div class="job-list" id="jobList"></div>
      </div>
    </div>

    <div id="detailView" style="display:none;">
      <div id="toolPanel"></div>
    </div>

    <div class="card-footer">
      <div class="card-footer-title">BROMAR HUB — JOB MANAGER</div>
      <a class="card-footer-link" href="https://bromarhub.netlify.app/employee-resources/suggestions-feedback" target="_blank" rel="noopener">🐞 Report a bug or suggest an improvement</a>
      <div class="card-footer-version">Version V1.01</div>
    </div>

  </main>
</div>

<script>
const JOBS = [
  { id:1, number:'BE-2451', client:'Westfield Plant Room',         desc:'Switchboard upgrade — Level 3',        status:'active',   opened:'2026-04-12', updated:'2026-05-18', pm:'D. Marshall' },
  { id:2, number:'BC-1187', client:'St Vincent\'s Hospital',       desc:'Comms cabinet relocation',             status:'active',   opened:'2026-05-02', updated:'2026-05-17', pm:'A. Bromar' },
  { id:3, number:'BA-0892', client:'Northland Shopping Centre',    desc:'HVAC compressor replacement',          status:'pending',  opened:'2026-05-15', updated:'2026-05-15', pm:'D. Marshall' },
  { id:4, number:'BS-3340', client:'Melbourne Airport T2',         desc:'Quarterly UPS service',                status:'complete', opened:'2026-03-08', updated:'2026-04-30', pm:'J. Reed' },
  { id:5, number:'BM-1102', client:'Coles Distribution Centre',    desc:'General maintenance — May visit',      status:'active',   opened:'2026-05-10', updated:'2026-05-18', pm:'A. Bromar' },
  { id:6, number:'BE-2392', client:'RMIT Building 80',              desc:'Emergency lighting compliance',        status:'pending',  opened:'2026-04-28', updated:'2026-05-11', pm:'J. Reed' },
];

const JOB_DATA = {
  1: {
    labour: [
      { date:'2026-05-18', employee:'D. Marshall', task:'Switchboard install', hours:7.5 },
      { date:'2026-05-17', employee:'M. Tan',      task:'Cable pulling',       hours:8.0 },
      { date:'2026-05-16', employee:'D. Marshall', task:'Site survey',         hours:4.0 },
    ],
    materials: [
      { date:'2026-05-15', item:'Distribution board, 24-way', qty:1,   supplier:'Lawrence & Hanson', cost:1240 },
      { date:'2026-05-15', item:'6mm² cable (per m)',          qty:200, supplier:'MMEM',              cost:540 },
    ],
    pos: [
      { po:'PO-04821', date:'2026-05-14', supplier:'Lawrence & Hanson', status:'Received', total:1780 },
      { po:'PO-04835', date:'2026-05-16', supplier:'MMEM',              status:'Pending',  total:620 },
    ],
    notes: [
      { date:'2026-05-17', author:'D. Marshall', note:'Client requested earlier finish — coordinating with M. Tan for Saturday.' },
    ],
    documents: [
      { icon:'📄', name:'Site Plan Rev B',     type:'PDF', updated:'2026-04-12' },
      { icon:'📐', name:'Single Line Diagram', type:'DWG', updated:'2026-04-15' },
    ],
    safety: [
      { icon:'🦺', name:'SWMS — Working at Heights', type:'V2.03', updated:'2026-05-12' },
      { icon:'⚡', name:'SWMS — Live Electrical',     type:'V3.01', updated:'2026-05-12' },
      { icon:'📋', name:'Site Induction Record',     type:'Form',  updated:'2026-04-12' },
    ],
    testing: [
      { date:'2026-05-18', type:'Insulation Resistance', by:'D. Marshall', result:'Pass' },
    ],
  },
  2: {
    labour: [ { date:'2026-05-17', employee:'A. Bromar', task:'Cabinet mounting', hours:6.0 } ],
    materials: [], pos: [], notes: [], documents: [], safety: [], testing: [],
  },
};

let selectedJob = null;
let activeTool = 'overview';
let searchFilter = { text:'', status:'all', prefix:null };

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function statusBadge(s) { return `<span class="job-status status-${s}">${s}</span>`; }
function jobData(jobId) {
  return JOB_DATA[jobId] || { labour:[], materials:[], pos:[], notes:[], documents:[], safety:[], testing:[] };
}

function renderJobList() {
  const list = document.getElementById('jobList');
  let jobs = JOBS.slice();

  if (searchFilter.status !== 'all') jobs = jobs.filter(j => j.status === searchFilter.status);
  if (searchFilter.prefix) jobs = jobs.filter(j => j.number.startsWith(searchFilter.prefix));
  if (searchFilter.text) {
    const q = searchFilter.text.toLowerCase();
    jobs = jobs.filter(j =>
      j.number.toLowerCase().includes(q) ||
      j.client.toLowerCase().includes(q) ||
      j.desc.toLowerCase().includes(q)
    );
  }

  if (!jobs.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">No jobs match your search</div></div>`;
    return;
  }

  list.innerHTML = jobs.map(j => `
    <div class="job-row" data-job-id="${j.id}">
      <div class="job-num">${j.number}</div>
      <div class="job-info">
        <div class="job-client">${escapeHtml(j.client)}</div>
        <div class="job-desc">${escapeHtml(j.desc)}</div>
      </div>
      ${statusBadge(j.status)}
    </div>
  `).join('');

  list.querySelectorAll('.job-row').forEach(el => {
    el.addEventListener('click', () => selectJob(+el.dataset.jobId));
  });
}

function selectJob(id) {
  const job = JOBS.find(j => j.id === id);
  if (!job) return;
  selectedJob = job;
  activeTool = 'overview';

  document.getElementById('pageWrapper').classList.add('has-sidebar');
  document.getElementById('sidebar').style.display = 'block';
  document.getElementById('searchView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';
  document.getElementById('sidebarToggle').style.display = window.innerWidth < 900 ? 'inline-flex' : 'none';
  document.getElementById('headerSubtitle').textContent = `Managing ${job.number} — ${job.client}`;

  document.getElementById('sbJobNum').textContent = job.number;
  document.getElementById('sbJobClient').textContent = job.client;
  document.getElementById('sbJobDesc').textContent = job.desc;

  const d = jobData(id);
  document.getElementById('cnt-labour').textContent    = d.labour.length;
  document.getElementById('cnt-materials').textContent = d.materials.length;
  document.getElementById('cnt-pos').textContent       = d.pos.length;
  document.getElementById('cnt-notes').textContent     = d.notes.length;
  document.getElementById('cnt-documents').textContent = d.documents.length;
  document.getElementById('cnt-safety').textContent    = d.safety.length;
  document.getElementById('cnt-testing').textContent   = d.testing.length;

  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tool === 'overview'));

  renderTool();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deselectJob() {
  selectedJob = null;
  document.getElementById('pageWrapper').classList.remove('has-sidebar');
  document.getElementById('sidebar').style.display = 'none';
  document.getElementById('sidebarToggle').style.display = 'none';
  document.getElementById('searchView').style.display = 'block';
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('headerSubtitle').textContent = 'Search and select a job to view its records';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderTool() {
  if (!selectedJob) return;
  const panel = document.getElementById('toolPanel');
  const d = jobData(selectedJob.id);

  if (activeTool === 'overview')   panel.innerHTML = renderOverview(selectedJob, d);
  if (activeTool === 'labour')     panel.innerHTML = renderLabour(d.labour);
  if (activeTool === 'materials')  panel.innerHTML = renderMaterials(d.materials);
  if (activeTool === 'pos')        panel.innerHTML = renderPOs(d.pos);
  if (activeTool === 'notes')      panel.innerHTML = renderNotes(d.notes);
  if (activeTool === 'documents')  panel.innerHTML = renderDocGrid('Documents', '📂', d.documents, 'No documents uploaded yet');
  if (activeTool === 'safety')     panel.innerHTML = renderDocGrid('Safety', '🦺', d.safety, 'No safety documents — add SWMS, inductions, or hazard records');
  if (activeTool === 'testing')    panel.innerHTML = renderTesting(d.testing);

  panel.querySelectorAll('.btn-add').forEach(b => {
    b.addEventListener('click', () => {
      if (window.BromarHub?.showInfo) BromarHub.showInfo(`${b.dataset.label || 'Add'} — coming soon`);
    });
  });
}

function renderOverview(job, d) {
  const hours = d.labour.reduce((s,l) => s + l.hours, 0);
  const mats  = d.materials.reduce((s,m) => s + m.cost, 0);
  return `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Status</div><div class="stat-value">${statusBadge(job.status)}</div></div>
      <div class="stat-card"><div class="stat-label">Labour Hours</div><div class="stat-value accent">${hours.toFixed(1)}</div></div>
      <div class="stat-card"><div class="stat-label">Materials</div><div class="stat-value">$${mats.toLocaleString()}</div></div>
      <div class="stat-card"><div class="stat-label">POs</div><div class="stat-value">${d.pos.length}</div></div>
    </div>
    <div class="tool-card">
      <div class="tool-card-header"><div class="tool-card-title">Job Details</div></div>
      <div class="data-table-wrapper">
        <table class="data-table">
          <tbody>
            <tr><th style="width:35%;">Job Number</th><td>${job.number}</td></tr>
            <tr><th>Client</th><td>${escapeHtml(job.client)}</td></tr>
            <tr><th>Description</th><td>${escapeHtml(job.desc)}</td></tr>
            <tr><th>Project Manager</th><td>${escapeHtml(job.pm)}</td></tr>
            <tr><th>Opened</th><td>${job.opened}</td></tr>
            <tr><th>Last Update</th><td>${job.updated}</td></tr>
          </tbody>
        </table>
      </div>
    </div>`;
}

function tableShell(title, addLabel, headers, rows, emptyText) {
  return `
    <div class="tool-card">
      <div class="tool-card-header">
        <div class="tool-card-title">${title}</div>
        <div class="tool-card-actions"><button class="btn-add" data-label="${addLabel}">+ ${addLabel}</button></div>
      </div>
      ${rows.length ? `
        <div class="data-table-wrapper">
          <table class="data-table">
            <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
            <tbody>${rows.join('')}</tbody>
          </table>
        </div>` : `<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">${emptyText}</div></div>`}
    </div>`;
}

function renderLabour(rows) {
  return tableShell('Labour', 'Add entry', ['Date','Employee','Task','Hours'],
    rows.map(l => `<tr><td>${l.date}</td><td>${escapeHtml(l.employee)}</td><td>${escapeHtml(l.task)}</td><td>${l.hours}</td></tr>`),
    'No labour recorded for this job');
}
function renderMaterials(rows) {
  return tableShell('Materials', 'Add material', ['Date','Item','Qty','Supplier','Cost'],
    rows.map(m => `<tr><td>${m.date}</td><td>${escapeHtml(m.item)}</td><td>${m.qty}</td><td>${escapeHtml(m.supplier)}</td><td>$${m.cost.toLocaleString()}</td></tr>`),
    'No materials recorded for this job');
}
function renderPOs(rows) {
  return tableShell('Purchase Orders', 'New PO', ['PO #','Date','Supplier','Status','Total'],
    rows.map(p => `<tr><td><strong>${p.po}</strong></td><td>${p.date}</td><td>${escapeHtml(p.supplier)}</td><td>${p.status}</td><td>$${p.total.toLocaleString()}</td></tr>`),
    'No purchase orders for this job');
}
function renderNotes(rows) {
  return tableShell('Notes', 'Add note', ['Date','Author','Note'],
    rows.map(n => `<tr><td style="white-space:nowrap;">${n.date}</td><td style="white-space:nowrap;">${escapeHtml(n.author)}</td><td>${escapeHtml(n.note)}</td></tr>`),
    'No notes yet — add the first one');
}
function renderTesting(rows) {
  return tableShell('Testing', 'Add test', ['Date','Type','Performed By','Result'],
    rows.map(t => `<tr><td>${t.date}</td><td>${escapeHtml(t.type)}</td><td>${escapeHtml(t.by)}</td><td><span class="job-status status-active">${t.result}</span></td></tr>`),
    'No test sheets recorded yet');
}
function renderDocGrid(title, icon, items, emptyText) {
  return `
    <div class="tool-card">
      <div class="tool-card-header">
        <div class="tool-card-title">${title}</div>
        <div class="tool-card-actions"><button class="btn-add" data-label="Upload">+ Upload</button></div>
      </div>
      ${items.length ? `
        <div class="doc-grid">
          ${items.map(d => `
            <div class="doc-tile">
              <div class="doc-icon">${d.icon || icon}</div>
              <div class="doc-name">${escapeHtml(d.name)}</div>
              <div class="doc-meta">${escapeHtml(d.type)} · ${d.updated}</div>
            </div>`).join('')}
        </div>` : `<div class="empty-state"><div class="empty-state-icon">${icon}</div><div class="empty-state-text">${emptyText}</div></div>`}
    </div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  renderJobList();

  document.getElementById('jobSearch').addEventListener('input', e => {
    searchFilter.text = e.target.value;
    renderJobList();
  });

  document.querySelectorAll('.filter-chip[data-status]').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip[data-status]').forEach(b => b.classList.remove('active'));
      c.classList.add('active');
      searchFilter.status = c.dataset.status;
      renderJobList();
    });
  });

  document.querySelectorAll('.filter-chip[data-prefix]').forEach(c => {
    c.addEventListener('click', () => {
      const wasActive = c.classList.contains('active');
      document.querySelectorAll('.filter-chip[data-prefix]').forEach(b => b.classList.remove('active'));
      if (!wasActive) {
        c.classList.add('active');
        searchFilter.prefix = c.dataset.prefix;
      } else {
        searchFilter.prefix = null;
      }
      renderJobList();
    });
  });

  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTool = btn.dataset.tool;
      renderTool();
      closeSidebarMobile();
    });
  });

  document.getElementById('changeJobBtn').addEventListener('click', () => {
    closeSidebarMobile();
    deselectJob();
  });

  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('show');
    document.getElementById('sidebarOverlay').classList.add('show');
  });
  document.getElementById('sidebarClose').addEventListener('click', closeSidebarMobile);
  document.getElementById('sidebarOverlay').addEventListener('click', closeSidebarMobile);

  window.addEventListener('resize', () => {
    if (selectedJob) {
      document.getElementById('sidebarToggle').style.display = window.innerWidth < 900 ? 'inline-flex' : 'none';
    }
  });
});

function closeSidebarMobile() {
  document.getElementById('sidebar').classList.remove('show');
  document.getElementById('sidebarOverlay').classList.remove('show');
}
</script>

</body>
</html>
