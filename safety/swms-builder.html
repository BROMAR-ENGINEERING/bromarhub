<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SWMS Builder — Bromar Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/tools/auth.js"></script>
  <link rel="stylesheet" href="../tools/bromar-hub.css"/>
  <script src="../tools/bromar-hub.js" defer></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

  <script src="../tools/swms-shared.js" defer></script>
  <script src="js/swms-builder-core.js" defer></script>
  <script src="js/tabs/sb-templates.js" defer></script>
  <script src="js/tabs/sb-swms.js" defer></script>
  <script src="js/swms-builder-boot.js" defer></script>

  <style>
    .page-wrapper { margin-top: 90px; max-width: 1100px; margin-left: auto; margin-right: auto; padding: 0 1.25rem; }
    @media (max-width: 520px) { .page-wrapper { margin-top: 80px; padding: 0 0.75rem; } }

    .sb-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding: 0 0.5rem; }
    .sb-tab { padding: 0.75rem 1.25rem; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.95rem; font-weight: 600; font-family: inherit; border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 0.4rem; }
    .sb-tab:hover { color: var(--text-primary); }
    .sb-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .sb-tab-count { display: inline-block; min-width: 22px; padding: 0 6px; height: 20px; line-height: 20px; text-align: center; font-size: 0.7rem; font-weight: 700; background: var(--card-hover); color: var(--accent); border-radius: 10px; }

    .sb-job-picker { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    .sb-job-picker-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .sb-job-picker-title { font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .sb-job-search { position: relative; }
    .sb-job-search input { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-main); color: var(--text-primary); font-size: 0.95rem; font-family: inherit; }
    .sb-job-search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .sb-job-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; max-height: 320px; overflow-y: auto; z-index: 20; display: none; box-shadow: 0 8px 24px var(--shadow); }
    .sb-job-results.show { display: block; }
    .sb-job-result { padding: 0.6rem 0.9rem; cursor: pointer; border-bottom: 1px solid var(--border); }
    .sb-job-result:last-child { border-bottom: none; }
    .sb-job-result:hover, .sb-job-result.hl { background: var(--card-hover); }
    .sb-job-result-num { font-weight: 700; color: var(--accent); font-size: 0.9rem; }
    .sb-job-result-desc { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }

    .sb-selected-job { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.9rem; background: var(--card-hover); border: 1px solid var(--accent); border-radius: 8px; gap: 0.5rem; flex-wrap: wrap; }
    .sb-selected-job-info { flex: 1; min-width: 0; }
    .sb-selected-job-num { font-weight: 700; color: var(--accent); font-size: 0.95rem; }
    .sb-selected-job-desc { font-size: 0.82rem; color: var(--text-secondary); margin-top: 2px; }

    .sb-list { display: flex; flex-direction: column; gap: 0.55rem; }
    .sb-list-item { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; gap: 0.75rem; flex-wrap: wrap; transition: border-color 0.15s; }
    .sb-list-item:hover { border-color: var(--accent); }
    .sb-list-info { flex: 1; min-width: 0; }
    .sb-list-title { font-weight: 700; font-size: 0.95rem; color: var(--text-primary); }
    .sb-list-meta { font-size: 0.78rem; color: var(--text-secondary); margin-top: 3px; }
    .sb-list-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .form-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem 1.75rem; }
    @media (max-width: 520px) { .form-card { padding: 1rem 1rem; } }

    .card-footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center; }
    .card-footer-title { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.8px; color: var(--text-primary); margin-bottom: 10px; }
    @media (max-width: 420px) { .card-footer-title { font-size: 0.85rem; letter-spacing: 0.5px; } }
    .card-footer-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 14px; }
    .card-footer-link:hover { text-decoration: underline; }
    .card-footer-version { font-size: 0.78rem; color: var(--text-secondary); font-weight: 500; opacity: 0.7; }

    .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); }
    .empty-state-icon { font-size: 3rem; margin-bottom: 0.5rem; opacity: 0.5; }
    .empty-state-text { font-size: 0.95rem; }

    .tool-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem 1.35rem; margin-bottom: 1rem; }
    .tool-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tool-card-title { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); }
    .tool-card-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .btn-add { padding: 0.55rem 1.1rem; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); color: white; cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 600; }
    .btn-add:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(234, 88, 12, 0.25); }

    .swms-detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; flex-wrap: wrap; }
    .swms-detail-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
    .swms-detail-meta { font-size: 0.85rem; color: var(--text-secondary); margin-top: 3px; }

    .field-group { margin-bottom: 0.85rem; }
    .field-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 0.4rem; }
    .field-group input, .field-group select { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-main); color: var(--text-primary); font-family: inherit; font-size: 0.95rem; }
    .required { color: var(--error); }
    .status-active { background: var(--success-bg); color: var(--success); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .status-superseded, .status-archived { background: var(--card-hover); color: var(--text-secondary); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .status-draft { background: var(--info-bg); color: var(--info-text); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="bromar-header"></div>

  <div class="page-title-wrapper" style="text-align:center;">
    <h1>SWMS Builder</h1>
    <p class="subtitle">Manage master templates and create job-specific SWMS</p>
  </div>

  <div class="page-wrapper">
    <div class="form-card">
      <div class="sb-tabs" id="sbTabs">
        <button class="sb-tab active" data-tab="templates">📚 Templates <span class="sb-tab-count" id="cnt-templates">–</span></button>
        <button class="sb-tab" data-tab="swms">🛡️ SWMS <span class="sb-tab-count" id="cnt-swms">–</span></button>
      </div>

      <div id="tabPanel"></div>

      <div class="card-footer">
        <div class="card-footer-title">BROMAR HUB — SWMS BUILDER</div>
        <a class="card-footer-link" href="https://bromarhub.netlify.app/employee-resources/suggestions-feedback" target="_blank" rel="noopener">🐞 Report a bug or suggest an improvement</a>
        <div class="card-footer-version">Version V1.00</div>
      </div>
    </div>
  </div>
</body>
</html>
