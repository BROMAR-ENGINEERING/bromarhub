  <style>
    .page-wrapper { margin-top: 90px; }
    @media (max-width: 520px) {
      .page-wrapper { margin-top: 80px; }
    }

    /* ── Event type colors ── */
    :root {
      --rdo: #457B9D;
      --holiday: #E63946;
      --lockdown: #2A9D8F;
      --picnic: #9b59b6;
    }

    /* ── Toolbar / View toggle ── */
    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }
    .view-toggle { display: flex; gap: 8px; }
    .view-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-btn svg { width: 16px; height: 16px; }
    .view-btn:hover { border-color: var(--accent); color: var(--accent); }
    .view-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Month nav ── */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 24px;
      padding: 16px;
      background: var(--bg-secondary);
      border-radius: 12px;
    }
    .month-nav button {
      width: 36px;
      height: 36px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .month-nav button:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(234, 88, 12, 0.08);
    }
    .month-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 200px;
      text-align: center;
    }

    /* ── Calendar grid ── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .day-header {
      background: var(--bg-secondary);
      padding: 12px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .day-cell {
      background: var(--bg-secondary);
      min-height: 120px;
      padding: 8px;
      position: relative;
      transition: all 0.2s;
    }
    .day-cell:hover { background: var(--card-hover); }
    .day-cell.other-month { opacity: 0.4; }
    .day-cell.today {
      background: rgba(234, 88, 12, 0.08);
      border: 2px solid var(--accent);
    }
    .day-number {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .day-cell.weekend .day-number { color: var(--accent); }

    .event-item {
      padding: 4px 6px;
      margin-bottom: 3px;
      border-radius: 3px;
      font-size: 0.75rem;
      color: #fff;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .event-item.rdo { background: var(--rdo); border-left: 3px solid var(--rdo); }
    .event-item.holiday { background: var(--holiday); border-left: 3px solid var(--holiday); }
    .event-item.lockdown { background: var(--lockdown); border-left: 3px solid var(--lockdown); }
    .event-item.picnic { background: var(--picnic); border-left: 3px solid var(--picnic); }

    @media (max-width: 768px) {
      .event-item.expanded {
        white-space: normal;
        position: absolute;
        left: 0;
        right: 0;
        z-index: 5;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        padding: 3px 4px;
      }
    }

    /* ── List view ── */
    .list-group { margin-bottom: 24px; }
    .list-month-header {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--border);
    }
    .list-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      transition: all 0.2s;
    }
    .list-row:hover { border-color: var(--accent); }
    .list-emp-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .list-emp-name { font-weight: 600; color: var(--text-primary); flex: 1; min-width: 120px; }
    .list-dates { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; }
    @media (max-width: 600px) {
      .list-row { flex-wrap: wrap; gap: 8px; }
      .list-dates { width: 100%; order: 3; }
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      gap: 24px;
      margin-top: 24px;
      padding: 16px;
      background: var(--bg-secondary);
      border-radius: 12px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .legend-color {
      width: 24px;
      height: 16px;
      border-radius: 3px;
    }

    /* ── Visit link ── */
    .visit-link-row { text-align: center; margin-top: 2rem; }
    .visit-link {
      display: inline-block;
      background: var(--accent);
      color: #fff !important;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
      transition: all 0.2s;
    }
    .visit-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
    }

    /* ── Card footer ── */
    .card-footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .card-footer-title {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.8px;
      color: var(--text-primary);
      margin-bottom: 10px;
      white-space: nowrap;
    }
    @media (max-width: 420px) {
      .card-footer-title { font-size: 0.85rem; letter-spacing: 0.5px; }
    }
    .card-footer-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .card-footer-link:hover { text-decoration: underline; }
    .card-footer-version {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .calendar-grid { font-size: 0.8rem; }
      .day-cell { min-height: 80px; padding: 4px; }
      .event-item { font-size: 0.65rem; padding: 2px 4px; }
      .month-title { font-size: 1.1rem; }
      .toolbar { justify-content: center; }
      .event-item.lockdown .lockdown-full { display: none; }
      .event-item.lockdown .lockdown-short { display: inline; }
    }
    .event-item.lockdown .lockdown-short { display: none; }
  </style>
</head>

    </div>
  </div>
</div>

  // ============================================================
  // STATE
  // ============================================================
  let currentDate = new Date();
  let currentView = 'calendar';

  // ── ISO date helper ──
  function isoDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  // ============================================================
  // RENDER CALENDAR
  // ============================================================
  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthTitle').textContent =
      currentDate.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDay = firstDay.getDay();
    const daysInMonth = lastDay.getDate();

    const prevMonthLastDay = new Date(year, month, 0).getDate();
    const prevMonthDays = startDay === 0 ? 6 : startDay - 1; // Monday start

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    // Day headers (Mon - Sun)
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(day => {
      const header = document.createElement('div');
      header.className = 'day-header';
      header.textContent = day;
      grid.appendChild(header);
    });

    // Previous month days
    for (let i = prevMonthDays; i > 0; i--) {
      const dayNum = prevMonthLastDay - i + 1;
      const date = new Date(year, month - 1, dayNum);
      grid.appendChild(createDayCell(date, dayNum, true));
    }

    // Current month days
    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(year, month, day);
      grid.appendChild(createDayCell(date, day, false));
    }

    // Next month fillers
    const totalCells = prevMonthDays + daysInMonth;
    const remainingCells = Math.ceil(totalCells / 7) * 7 - totalCells;
    for (let day = 1; day <= remainingCells; day++) {
      const date = new Date(year, month + 1, day);
      grid.appendChild(createDayCell(date, day, true));
    }
  }

  function createDayCell(date, dayNum, isOtherMonth) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if (isOtherMonth) cell.classList.add('other-month');

    const dayOfWeek = date.getDay();
    if (dayOfWeek === 0 || dayOfWeek === 6) cell.classList.add('weekend');

    const today = new Date();
    if (date.toDateString() === today.toDateString()) cell.classList.add('today');

    const dayNumber = document.createElement('div');
    dayNumber.className = 'day-number';
    dayNumber.textContent = dayNum;
    cell.appendChild(dayNumber);

    getEventsForDate(date).forEach(event => {
      const eventItem = document.createElement('div');
      eventItem.className = 'event-item ' + event.type;
      if (event.type === 'lockdown') {
        eventItem.innerHTML = '<span class="lockdown-full">' + BromarHub.escapeHtml(event.title) + '</span><span class="lockdown-short">L/D</span>';
      } else {
        eventItem.textContent = event.title;
      }
      eventItem.title = event.title;
      cell.appendChild(eventItem);
    });

    return cell;
  }

  function getEventsForDate(date) {
    const dateStr = isoDate(date);
    return allEvents.filter(e => dateStr >= e.start_date && dateStr <= e.end_date);
  }

  // ============================================================
  // LIST VIEW
  // ============================================================
  function renderList() {
    const container = document.getElementById('rosterList');
    const todayStr = isoDate(new Date());
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    // Only show current + upcoming
    const entries = allEvents
      .filter(e => e.end_date >= todayStr)
      .slice()
      .sort((a, b) => a.start_date.localeCompare(b.start_date));

    if (!entries.length) {
      container.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--text-secondary)">No upcoming entries.</div>';
      return;
    }

    // Group by month-year of start date
    const groups = {};
    entries.forEach(e => {
      const key = e.start_date.slice(0, 7);
      if (!groups[key]) groups[key] = [];
      groups[key].push(e);
    });

    let html = '';
    Object.keys(groups).sort().forEach(key => {
      const [y, m] = key.split('-').map(Number);
      html += '<div class="list-group">';
      html += '<div class="list-month-header">' + months[m - 1] + ' ' + y + '</div>';

      groups[key].forEach(e => {
        const colour = getTypeColour(e.type);
        html += '<div class="list-row">';
        html += '<span class="list-emp-dot" style="background:' + colour + '"></span>';
        html += '<span class="list-emp-name">' + BromarHub.escapeHtml(e.title) + '</span>';
        const dateText = e.start_date === e.end_date
          ? fmtDateShort(e.start_date)
          : fmtDateShort(e.start_date) + ' — ' + fmtDateShort(e.end_date);
        html += '<span class="list-dates">' + dateText + '</span>';
        html += '</div>';
      });

      html += '</div>';
    });

    container.innerHTML = html;
  }

  function getTypeColour(type) {
    return { rdo:'#457B9D', holiday:'#E63946', lockdown:'#2A9D8F', picnic:'#9b59b6' }[type] || '#457B9D';
  }

  function fmtDateShort(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dt = new Date(y, m - 1, d);
    return days[dt.getDay()] + ' ' + d + ' ' + months[m - 1] + ' ' + y;
  }

  // ============================================================
  // VIEW TOGGLE
  // ============================================================
  function switchView(view) {
    currentView = view;
    document.getElementById('calendarView').style.display = view === 'calendar' ? 'block' : 'none';
    document.getElementById('listView').style.display = view === 'list' ? 'block' : 'none';
    document.getElementById('viewCalendarBtn').classList.toggle('active', view === 'calendar');
    document.getElementById('viewListBtn').classList.toggle('active', view === 'list');
    if (view === 'calendar') renderCalendar();
    else renderList();
  }
  document.getElementById('viewCalendarBtn').addEventListener('click', () => switchView('calendar'));
  document.getElementById('viewListBtn').addEventListener('click', () => switchView('list'));

  // ============================================================
  // MONTH NAVIGATION
  // ============================================================
  document.getElementById('prevMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  // ============================================================
  // TAP TO EXPAND (Mobile)
  // ============================================================
  document.addEventListener('click', function(e) {
    const eventItem = e.target.closest('.event-item');
    if (eventItem) eventItem.classList.toggle('expanded');
  });

  // ============================================================
  // INIT
  // ============================================================
  document.addEventListener('DOMContentLoaded', () => {
    renderCalendar();
  });
</script>
